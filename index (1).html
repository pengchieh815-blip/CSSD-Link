function h(tag, attrs, ...kids) {
  const e = document.createElement(tag);
  if(attrs) for(const [k,v] of Object.entries(attrs)) {
    if(k==="style") e.style.cssText=v;
    else if(k.startsWith("on")) e.addEventListener(k.slice(2).toLowerCase(),v);
    else if(k==="disabled"&&v) e.disabled=true;
    else e.setAttribute(k,v);
  }
  for(const k of kids.flat()) if(k!=null&&k!==false) e.append(typeof k==="string"?document.createTextNode(k):k);
  return e;
}

  gState.loading = false;
  render();
});

function render() {
  root.innerHTML="";
  if(gState.loading){ root.append(h("div",{style:"display:flex;align-items:center;justify-content:center;height:100vh;font-size:14px;color:#6b7280;"},"⏳ 載入中…")); return; }

  else if(gState.view==="form") root.append(renderForm());
  else if(gState.view==="cssd") root.append(renderCssd());
}

function go(view, selUnit) { gState.view=view; if(selUnit!==undefined) gState.selUnit=selUnit; render(); }

              : sr.map(it=>h("div",{style:"display:flex;align-items:center;justify-content:space-between;padding:9px 10px;border-bottom:1px solid #f3f4f6;flex-wrap:wrap;gap:6px;"},
                  h("div",null,h("span",{style:"font-size:12px;font-weight:600;color:#374151;"},it.label),h("span",{style:"font-size:10px;color:#9ca3af;margin-left:5px;"},it.catLabel)),
                  h("div",{style:"display:flex;align-items:center;gap:3px;"},
                    h("button",{style:"width:24px;height:24px;border-radius:50%;border:1.5px solid #d1d5db;background:#f9fafb;font-size:14px;cursor:pointer;",onclick:()=>setQty(it.label,(cart[it.label]||0)-1)},"－"),
                    h("input",{type:"number",min:"0",style:"width:40px;height:24px;text-align:center;border:1.5px solid #d1d5db;border-radius:5px;font-size:12px;",value:cart[it.label]||0,onchange:e=>setQty(it.label,e.target.value)}),
                    h("button",{style:`width:24px;height:24px;border-radius:50%;border:none;background:${ut.color};color:#fff;font-size:14px;cursor:pointer;`,onclick:()=>setQty(it.label,(cart[it.label]||0)+1)},"＋")
                  )
                ))
          ),
          !search.trim() && h("div",{style:"margin-top:6px;"},
            ...CATS.map(cat=>{
              const sel = cat.items.filter(i=>cart[i]>0).length;
              const isOpen = openCat===cat.id;
              const blk = h("div",{style:"border:1.5px solid #e5e7eb;border-radius:9px;overflow:hidden;margin-bottom:5px;"},
                h("button",{style:"width:100%;display:flex;justify-content:space-between;align-items:center;padding:10px 12px;background:#f9fafb;border:none;cursor:pointer;font-family:inherit;font-size:12px;font-weight:700;color:#374151;",onclick:()=>{gForm.openCat=isOpen?null:cat.id;render();}},
                  h("span",null,cat.icon," ",cat.label),
                  h("div",{style:"display:flex;align-items:center;gap:6px;"},
                    sel>0 && h("span",{style:`background:${ut.color};color:#fff;font-size:9px;font-weight:700;padding:2px 7px;border-radius:9px;`},`已選 ${sel} 項`),
                    h("span",{style:"color:#9ca3af;font-size:12px;"},isOpen?"▲":"▼")
                  )
                )
              );
              if(isOpen) blk.append(h("div",{style:"padding:4px 8px;"},
                ...cat.items.map(label=>h("div",{style:"display:flex;align-items:center;justify-content:space-between;padding:6px 3px;border-bottom:1px solid #f3f4f6;gap:6px;"},
                  h("span",{style:"font-size:12px;color:#374151;flex:1;"},label),
                  h("div",{style:"display:flex;align-items:center;gap:3px;"},
                    h("button",{style:"width:24px;height:24px;border-radius:50%;border:1.5px solid #d1d5db;background:#f9fafb;font-size:14px;cursor:pointer;",onclick:()=>setQty(label,(cart[label]||0)-1)},"－"),
                    h("input",{type:"number",min:"0",style:"width:40px;height:24px;text-align:center;border:1.5px solid #d1d5db;border-radius:5px;font-size:12px;",value:cart[label]||0,onchange:e=>setQty(label,e.target.value)}),
                    h("button",{style:`width:24px;height:24px;border-radius:50%;border:none;background:${(cart[label]||0)>0?ut.color:"#e5e7eb"};color:${(cart[label]||0)>0?"#fff":"#374151"};font-size:14px;cursor:pointer;`,onclick:()=>setQty(label,(cart[label]||0)+1)},"＋")
                  )
                ))
              ));
              return blk;
            })
          )
        )
      ),
      sec("備註（選填）",false,h("textarea",{style:"width:100%;padding:9px 10px;border:2px solid #d1d5db;border-radius:9px;font-size:13px;font-family:inherit;resize:none;box-sizing:border-box;",rows:"2",placeholder:"特殊狀況、污染程度、急用時間…",oninput:e=>{gForm.note=e.target.value;}},note)),
      h("button",{
        style:`width:100%;padding:13px;background:${ut.color};color:#fff;border:none;border-radius:10px;font-size:14px;font-weight:800;cursor:pointer;font-family:inherit;opacity:${canSubmit?1:0.4};margin-top:4px;`,
        disabled:!canSubmit,
        onclick: async()=>{
          if(!canSubmit)return;
          const items=Object.entries(gForm.cart).map(([label,qty])=>({label,qty}));
          await addDoc(collection(db,"orders"),{
            orderId:`${ut.id.toUpperCase()}${Date.now()}`,unitType:gState.selUnit,
            unit:gForm.unit,urgent:gForm.urgent,items,note:gForm.note,
            time:nowStr(),status:"待清洗",createdAt:Date.now()
          });
          gForm.done=true; render();
        }
      },"送出送洗申請"),
      !canSubmit && h("p",{style:"text-align:center;color:#9ca3af;font-size:11px;margin-top:6px;"},"請選擇送洗單位，並至少加入一項器械")
    )
  );
}

// ── 供應室管理頁
function renderCssd() {
  let stF="全部", utF="全部", urgO=false, showE=false;
  let dFrom=todayStr(), dTo=todayStr();

  function build() {
    const {orders} = gState;
    const sorted=[...orders].sort((a,b)=>{ if(a.urgent==="急件"&&b.urgent!=="急件")return -1; if(b.urgent==="急件"&&a.urgent!=="急件")return 1; return(b.createdAt||0)-(a.createdAt||0); });
    const shown=sorted.filter(o=>{ if(stF!=="全部"&&o.status!==stF)return false; if(utF!=="全部"&&o.unitType!==utF)return false; if(urgO&&o.urgent!=="急件")return false; return true; });
    const expCnt=orders.filter(o=>{ const d=o.time.slice(0,10).replace(/\//g,"-"); return(!dFrom||d>=dFrom)&&(!dTo||d<=dTo); }).length;

    const fb=(label,active,color,fn)=>h("button",{style:`padding:5px 9px;border:${active?"none":"1.5px solid #d1d5db"};border-radius:12px;background:${active?color:"#f9fafb"};color:${active?"#fff":"#374151"};font-size:10px;cursor:pointer;font-family:inherit;font-weight:600;`,onclick:fn},label);

    const csvDL = () => {
      const filtered=orders.filter(o=>{ const d=o.time.slice(0,10).replace(/\//g,"-"); return(!dFrom||d>=dFrom)&&(!dTo||d<=dTo); });
      if(!filtered.length){alert("所選範圍內沒有資料");return;}
      const rows=[["單號","時間","單位類型","送洗單位","緊急程度","器械名稱","數量","狀態","備註"]];
      filtered.forEach(o=>o.items.forEach((it,i)=>rows.push([i===0?o.orderId:"",i===0?o.time:"",i===0?uInfo(o.unitType).label:"",i===0?o.unit:"",i===0?o.urgent:"",it.label,it.qty,i===0?o.status:"",i===0?(o.note||""):""])));
      const esc=c=>'"'+String(c).replace(/"/g,'""')+'"';
      const csv="\uFEFF"+rows.map(r=>r.map(esc).join(",")).join("\r\n");
      const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([csv],{type:"text/csv;charset=utf-8;"}));a.download=`CSSD_Link_${dFrom}_${dTo}.csv`;a.click();
    };

    const dom = h("div",{style:"min-height:100vh;background:#f1f5f9;"},
      h("div",{style:"background:#1e293b;color:#fff;padding:12px 14px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:10;"},
        h("button",{style:"background:rgba(255,255,255,.15);color:#fff;border:none;border-radius:7px;padding:6px 10px;font-size:11px;cursor:pointer;font-family:inherit;",onclick:()=>go("home")},"← 返回"),
        h("div",{style:"font-size:14px;font-weight:800;"},"📋 供應室管理"),
        h("button",{style:"background:rgba(16,185,129,.25);color:#fff;border:none;border-radius:7px;padding:6px 10px;font-size:11px;cursor:pointer;font-family:inherit;",onclick:()=>{showE=!showE;rerender();}},"📥 報表")
      ),
      h("div",{style:"padding:10px 10px 40px;"},
        showE && h("div",{style:"background:#fff;border:2px solid #10b981;border-radius:10px;padding:12px;margin-bottom:10px;"},
          h("div",{style:"font-weight:800;color:#065f46;margin-bottom:3px;"},"📥 下載 CSV 報表"),
          h("div",{style:"font-size:11px;color:#6b7280;margin-bottom:8px;"},"匯出後可直接用 Excel 開啟，中文不亂碼"),
          h("div",{style:"display:flex;gap:6px;margin-bottom:8px;flex-wrap:wrap;"},
            [["今天","today"],["本週","week"],["本月","month"]].map(([l,k])=>h("button",{style:"padding:5px 10px;border:1.5px solid #10b981;border-radius:12px;background:#ecfdf5;color:#065f46;font-size:11px;cursor:pointer;font-weight:700;font-family:inherit;",onclick:()=>{
              const t=new Date(),fmt=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
              if(k==="today"){dFrom=fmt(t);dTo=fmt(t);}
              if(k==="week"){const m=new Date(t);m.setDate(t.getDate()-t.getDay()+1);dFrom=fmt(m);dTo=fmt(t);}
              if(k==="month"){dFrom=fmt(new Date(t.getFullYear(),t.getMonth(),1));dTo=fmt(t);}
              rerender();
            }},l))
          ),
          h("div",{style:"display:flex;gap:8px;align-items:center;margin-bottom:8px;flex-wrap:wrap;"},
            h("span",{style:"font-size:12px;font-weight:600;"},"從"),
            h("input",{type:"date",style:"border:2px solid #d1d5db;border-radius:7px;padding:5px 8px;font-size:12px;font-family:inherit;",value:dFrom,onchange:e=>{dFrom=e.target.value;rerender();}}),
            h("span",{style:"font-size:12px;font-weight:600;"},"至"),
            h("input",{type:"date",style:"border:2px solid #d1d5db;border-radius:7px;padding:5px 8px;font-size:12px;font-family:inherit;",value:dTo,onchange:e=>{dTo=e.target.value;rerender();}})
          ),
          h("div",{style:"background:#f0fdf4;border:1px solid #bbf7d0;border-radius:7px;padding:6px 10px;font-size:12px;color:#166534;margin-bottom:8px;font-weight:600;"},expCnt>0?`共 ${expCnt} 筆記錄符合條件`:"⚠️ 所選範圍內沒有資料"),
          h("button",{style:"width:100%;padding:10px;background:#10b981;color:#fff;border:none;border-radius:9px;font-size:13px;font-weight:800;cursor:pointer;font-family:inherit;",onclick:csvDL},"⬇️ 下載 CSV")
        ),
        h("div",{style:"background:#fff;border-radius:10px;padding:9px;margin-bottom:10px;box-shadow:0 1px 3px rgba(0,0,0,.07);"},
          h("div",{style:"display:flex;gap:5px;flex-wrap:wrap;margin-bottom:6px;"},
            ["全部",...STATUSES].map(st=>fb(st==="全部"?"全部":SC[st].icon+" "+st, stF===st, st==="全部"?"#1e293b":SC[st].color, ()=>{stF=st;rerender();}))
          ),
          h("div",{style:"display:flex;gap:5px;flex-wrap:wrap;"},
            fb("全部單位",utF==="全部","#1e293b",()=>{utF="全部";rerender();}),
            ...UNIT_TYPES.map(ut=>fb(ut.icon+" "+ut.label,utF===ut.id,ut.color,()=>{utF=ut.id;rerender();})),
            fb("🔴 急件",urgO,"#ef4444",()=>{urgO=!urgO;rerender();})
          )
        ),
        shown.length===0 && h("div",{style:"text-align:center;color:#9ca3af;padding:36px 0;font-size:13px;"},"目前沒有符合條件的記錄"),
        ...shown.map(order=>{
          const ut2=uInfo(order.unitType); const sc=SC[order.status]||SC["待清洗"];
          return h("div",{style:`background:#fff;border-radius:10px;padding:10px;margin-bottom:8px;box-shadow:0 1px 4px rgba(0,0,0,.07);border-left:4px solid ${order.urgent==="急件"?"#ef4444":"transparent"};`},
            h("div",{style:"display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:6px;"},
              h("div",{style:"display:flex;gap:5px;flex-wrap:wrap;"},
                h("span",{style:`background:${sc.color};color:#fff;font-size:9px;font-weight:700;padding:2px 7px;border-radius:12px;`},sc.icon," ",order.status),
                h("span",{style:`background:${ut2.color};color:#fff;font-size:9px;font-weight:700;padding:2px 7px;border-radius:12px;`},ut2.icon," ",ut2.label),
                order.urgent==="急件"&&h("span",{style:"background:#ef4444;color:#fff;font-size:9px;font-weight:700;padding:2px 7px;border-radius:12px;"},"🔴 急件")
              ),
              h("span",{style:"font-size:10px;color:#9ca3af;white-space:nowrap;margin-left:3px;"},order.time)
            ),
            h("div",{style:"display:flex;gap:8px;font-size:11px;color:#374151;margin-bottom:6px;flex-wrap:wrap;"},
              h("span",null,"📍 ",order.unit),
              h("span",{style:"color:#9ca3af;font-size:10px;"},order.orderId)
            ),
            h("div",{style:"display:flex;flex-wrap:wrap;gap:4px;margin-bottom:5px;"},
              ...(order.items||[]).map(it=>h("span",{style:`border:1.5px solid ${ut2.color};border-radius:6px;padding:2px 7px;font-size:10px;font-weight:600;color:${ut2.color};`},it.label," × ",it.qty))
            ),
            order.note&&h("div",{style:"font-size:11px;color:#6b7280;margin-bottom:6px;font-style:italic;"},"📝 ",order.note),
            h("div",{style:"display:flex;gap:4px;flex-wrap:wrap;"},
              ...STATUSES.map(st=>h("button",{
                style:`flex:1;min-width:60px;padding:5px 2px;border:${order.status===st?"none":"1.5px solid #d1d5db"};border-radius:6px;background:${order.status===st?SC[st].color:"#f9fafb"};color:${order.status===st?"#fff":"#374151"};font-size:10px;cursor:pointer;font-family:inherit;font-weight:700;`,
                onclick:()=>updateDoc(doc(db,"orders",order.id),{status:st})
              },SC[st].icon," ",st))
            )
          );
        })
      )
    );
    return dom;
  }

  function rerender() { root.innerHTML=""; root.append(build()); }
  return build();
}

function sec(label,required,content) {
  return h("div",{style:"margin-bottom:16px;"},
    h("div",{style:"font-size:12px;font-weight:700;color:#374151;margin-bottom:6px;"},label,required&&h("span",{style:"color:#ef4444;margin-left:2px;"},"*")),
    content
  );
}

render();
</script>
</body>
</html>
