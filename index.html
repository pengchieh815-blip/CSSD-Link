<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>系統優化展示 - 廠商登記與供應室管理</title>
  <!-- 引入 Tailwind CSS 快速樣式 -->
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 min-h-screen text-slate-800 p-6">

  <div class="max-w-5xl mx-auto space-y-8">
    
    <!-- 頁面標題與分頁切換 -->
    <header class="bg-white p-6 rounded-xl shadow-sm border border-slate-200 flex justify-between items-center">
      <div>
        <h1 class="text-2xl font-bold text-slate-900">系統流程優化示範模組</h1>
        <p class="text-sm text-slate-500 mt-1">解決廠商登記阻塞問題與優化供應室請領作業</p>
      </div>
      <div class="flex space-x-2 bg-slate-100 p-1 rounded-lg">
        <button id="tab1-btn" onclick="switchTab('tab1')" class="px-4 py-2 rounded-md font-medium text-sm transition bg-white text-blue-600 shadow-sm">
          1. 廠商登記模組
        </button>
        <button id="tab2-btn" onclick="switchTab('tab2')" class="px-4 py-2 rounded-md font-medium text-sm transition text-slate-600 hover:text-slate-900">
          2. 供應室請領模組
        </button>
      </div>
    </header>

    <!-- 模組一：廠商登記（解決無法送出問題） -->
    <section id="tab1" class="bg-white p-6 rounded-xl shadow-sm border border-slate-200">
      <h2 class="text-lg font-bold border-b pb-3 mb-4 text-slate-800">廠商登記申請表</h2>
      
      <form id="vendorForm" onsubmit="handleVendorSubmit(event)" class="space-y-4">
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
          <!-- 統一編號 -->
          <div>
            <label class="block text-sm font-medium text-slate-700">統一編號 <span class="text-red-500">*</span></label>
            <input type="text" id="taxId" placeholder="請輸入 8 位數統編" required pattern="[0-9]{8}"
                   class="mt-1 w-full p-2.5 border rounded-lg focus:ring-2 focus:ring-blue-500 outline-none text-sm"
                   oninput="validateField(this, 'taxIdError', '請輸入正確的 8 位數字統編')">
            <span id="taxIdError" class="text-xs text-red-500 hidden mt-1"></span>
          </div>

          <!-- 廠商名稱 -->
          <div>
            <label class="block text-sm font-medium text-slate-700">廠商名稱 <span class="text-red-500">*</span></label>
            <input type="text" id="companyName" placeholder="請輸入公司完整名稱" required
                   class="mt-1 w-full p-2.5 border rounded-lg focus:ring-2 focus:ring-blue-500 outline-none text-sm">
          </div>

          <!-- 聯絡人 Email -->
          <div>
            <label class="block text-sm font-medium text-slate-700">聯絡人 Email <span class="text-red-500">*</span></label>
            <input type="email" id="email" placeholder="example@company.com" required
                   class="mt-1 w-full p-2.5 border rounded-lg focus:ring-2 focus:ring-blue-500 outline-none text-sm">
          </div>

          <!-- 上傳文件 -->
          <div>
            <label class="block text-sm font-medium text-slate-700">營業執照/登記證明文件 (PDF/JPG) <span class="text-red-500">*</span></label>
            <input type="file" id="document" required accept=".pdf,.jpg,.png" onchange="checkFile(this)"
                   class="mt-1 w-full text-sm text-slate-500 file:mr-4 file:py-2 file:px-4 file:rounded-lg file:border-0 file:bg-blue-50 file:text-blue-700 hover:file:bg-blue-100">
            <span id="fileError" class="text-xs text-red-500 hidden mt-1"></span>
          </div>
        </div>

        <!-- 同意條款規範（自動解鎖送出按鈕） -->
        <div class="pt-4 border-t border-slate-100">
          <label class="flex items-center space-x-2 cursor-pointer">
            <input type="checkbox" id="agreeTerms" onchange="toggleSubmitButton()" class="w-4 h-4 text-blue-600 rounded">
            <span class="text-sm text-slate-600">我已確認上述資料填寫無誤，並同意服務與隱私權條款 <span class="text-red-500">*</span></span>
          </label>
        </div>

        <!-- 錯誤訊息提示區塊（送出失敗時顯現） -->
        <div id="submitAlert" class="hidden p-3 bg-red-50 border border-red-200 text-red-700 text-sm rounded-lg"></div>

        <!-- 送出按鈕 -->
        <div class="flex justify-end pt-2">
          <button type="submit" id="submitBtn" disabled
                  class="px-6 py-2.5 bg-slate-300 text-slate-500 font-medium rounded-lg cursor-not-allowed transition">
            確認送出申請
          </button>
        </div>
      </form>
    </section>

    <!-- 模組二：供應室請領管理（優化流程版） -->
    <section id="tab2" class="bg-white p-6 rounded-xl shadow-sm border border-slate-200 hidden">
      <div class="flex justify-between items-center border-b pb-3 mb-4">
        <h2 class="text-lg font-bold text-slate-800">供應室耗材請領與管理</h2>
        <!-- 常用範本功能 -->
        <button onclick="applyTemplate('surgical')" class="px-3 py-1.5 bg-emerald-50 text-emerald-700 border border-emerald-200 rounded-lg text-xs font-medium hover:bg-emerald-100">
          ⚡ 帶入常用範本 (手術常備包)
        </button>
      </div>

      <!-- 快捷卡片/搜尋 -->
      <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-6">
        <div class="md:col-span-2">
          <label class="block text-sm font-medium text-slate-700 mb-1">關鍵字 / 料號 / 條碼快速搜尋</label>
          <input type="text" id="itemSearch" placeholder="輸入「紗布」、「無菌」或料號..." onkeyup="filterItems()"
                 class="w-full p-2.5 border rounded-lg text-sm focus:ring-2 focus:ring-blue-500 outline-none">
        </div>
        <div>
          <label class="block text-sm font-medium text-slate-700 mb-1">目前請領人資訊 (自動帶入)</label>
          <div class="p-2.5 bg-slate-50 border rounded-lg text-sm text-slate-600">
            張護理師 (手術室 A 組)
          </div>
        </div>
      </div>

      <!-- 品項列表與即時庫存預警 -->
      <table class="w-full text-left text-sm border-collapse">
        <thead>
          <tr class="bg-slate-50 text-slate-600 border-b">
            <th class="p-3">料號</th>
            <th class="p-3">品項名稱</th>
            <th class="p-3">即時庫存</th>
            <th class="p-3">需求數量</th>
            <th class="p-3">操作</th>
          </tr>
        </thead>
        <tbody id="itemTable">
          <tr class="border-b hover:bg-slate-50/50">
            <td class="p-3 text-slate-500">MED-001</td>
            <td class="p-3 font-medium">滅菌手套 (M)</td>
            <td class="p-3"><span class="px-2 py-1 bg-green-100 text-green-700 text-xs rounded-full">充裕 (120 包)</span></td>
            <td class="p-3">
              <input type="number" value="0" min="0" max="120" class="w-20 p-1 border rounded text-center item-qty" data-id="MED-001">
            </td>
            <td class="p-3"><button onclick="addToCart('MED-001')" class="text-blue-600 hover:underline">加入清單</button></td>
          </tr>
          <tr class="border-b hover:bg-slate-50/50">
            <td class="p-3 text-slate-500">MED-002</td>
            <td class="p-3 font-medium">醫用無菌紗布 4x4</td>
            <td class="p-3"><span class="px-2 py-1 bg-amber-100 text-amber-700 text-xs rounded-full">偏低 (15 包)</span></td>
            <td class="p-3">
              <input type="number" value="0" min="0" max="15" class="w-20 p-1 border rounded text-center item-qty" data-id="MED-002">
            </td>
            <td class="p-3"><button onclick="addToCart('MED-002')" class="text-blue-600 hover:underline">加入清單</button></td>
          </tr>
          <tr class="border-b hover:bg-slate-50/50">
            <td class="p-3 text-slate-500">MED-003</td>
            <td class="p-3 font-medium">生理食鹽水 500ml</td>
            <td class="p-3"><span class="px-2 py-1 bg-red-100 text-red-700 text-xs rounded-full">極低 (3 瓶)</span></td>
            <td class="p-3">
              <input type="number" value="0" min="0" max="3" class="w-20 p-1 border rounded text-center item-qty" data-id="MED-003">
            </td>
            <td class="p-3"><button onclick="addToCart('MED-003')" class="text-blue-600 hover:underline">加入清單</button></td>
          </tr>
        </tbody>
      </table>

      <!-- 快速提交 -->
      <div class="mt-6 flex justify-between items-center p-4 bg-slate-50 rounded-lg border">
        <div class="text-sm text-slate-600">
          已選擇 <span id="cartCount" class="font-bold text-blue-600">0</span> 項耗材品項
        </div>
        <button onclick="submitSupplyRequest()" class="px-5 py-2 bg-blue-600 hover:bg-blue-700 text-white font-medium text-sm rounded-lg transition">
          一鍵送出請領單
        </button>
      </div>
    </section>

  </div>

  <!-- JavaScript 控制邏輯 -->
  <script>
    // 1. 分頁切換邏輯
    function switchTab(tabId) {
      document.getElementById('tab1').classList.add('hidden');
      document.getElementById('tab2').classList.add('hidden');
      document.getElementById(tabId).classList.remove('hidden');

      const btn1 = document.getElementById('tab1-btn');
      const btn2 = document.getElementById('tab2-btn');

      if(tabId === 'tab1') {
        btn1.className = "px-4 py-2 rounded-md font-medium text-sm transition bg-white text-blue-600 shadow-sm";
        btn2.className = "px-4 py-2 rounded-md font-medium text-sm transition text-slate-600 hover:text-slate-900";
      } else {
        btn2.className = "px-4 py-2 rounded-md font-medium text-sm transition bg-white text-blue-600 shadow-sm";
        btn1.className = "px-4 py-2 rounded-md font-medium text-sm transition text-slate-600 hover:text-slate-900";
      }
    }

    // 2. 廠商登記：解鎖送出按鈕機制
    function toggleSubmitButton() {
      const isChecked = document.getElementById('agreeTerms').checked;
      const btn = document.getElementById('submitBtn');
      
      if(isChecked) {
        btn.disabled = false;
        btn.className = "px-6 py-2.5 bg-blue-600 hover:bg-blue-700 text-white font-medium rounded-lg cursor-pointer transition shadow-sm";
      } else {
        btn.disabled = true;
        btn.className = "px-6 py-2.5 bg-slate-300 text-slate-500 font-medium rounded-lg cursor-not-allowed transition";
      }
    }

    // 3. 廠商登記：即時欄位驗證
    function validateField(input, errorId, message) {
      const errorEl = document.getElementById(errorId);
      if(!input.checkValidity()) {
        errorEl.textContent = message;
        errorEl.classList.remove('hidden');
      } else {
        errorEl.classList.add('hidden');
      }
    }

    // 檢查檔案大小與類型
    function checkFile(input) {
      const file = input.files[0];
      const errorEl = document.getElementById('fileError');
      if (file && file.size > 5 * 1024 * 1024) { // > 5MB
        errorEl.textContent = "檔案大小不能超過 5MB";
        errorEl.classList.remove('hidden');
        input.value = ""; // 清空
      } else {
        errorEl.classList.add('hidden');
      }
    }

    // 表單送出處理
    function handleVendorSubmit(e) {
      e.preventDefault();
      const alertEl = document.getElementById('submitAlert');
      
      // 模擬成功送出
      alertEl.className = "p-3 bg-green-50 border border-green-200 text-green-700 text-sm rounded-lg";
      alertEl.textContent = "✅ 廠商登記申請已成功送出！系統單號：V-2026073001";
      alertEl.classList.remove('hidden');
    }

    // 4. 供應室：搜尋過濾功能
    function filterItems() {
      const keyword = document.getElementById('itemSearch').value.toLowerCase();
      const rows = document.querySelectorAll('#itemTable tr');
      rows.forEach(row => {
        const text = row.textContent.toLowerCase();
        row.style.display = text.includes(keyword) ? '' : 'none';
      });
    }

    // 供應室：自動帶入常用範本
    function applyTemplate(type) {
      if(type === 'surgical') {
        const inputs = document.querySelectorAll('.item-qty');
        inputs[0].value = 10; // 滅菌手套
        inputs[1].value = 5;  // 紗布
        inputs[2].value = 2;  // 生理食鹽水
        updateCartCount();
        alert('已帶入「手術常備包」常用數量！');
      }
    }

    // 計算清單數量
    function updateCartCount() {
      let total = 0;
      document.querySelectorAll('.item-qty').forEach(input => {
        if(parseInt(input.value) > 0) total++;
      });
      document.getElementById('cartCount').textContent = total;
    }

    document.querySelectorAll('.item-qty').forEach(input => {
      input.addEventListener('change', updateCartCount);
    });

    function submitSupplyRequest() {
      const count = document.getElementById('cartCount').textContent;
      if(count === "0") {
        alert('請至少選擇一項耗材數量！');
      } else {
        alert('請領單已成功送出！供應室管理員將安排備貨。');
      }
    }
  </script>
</body>
</html>
