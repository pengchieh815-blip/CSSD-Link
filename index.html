});

// Archive & delete
const archiveAndDelete = async (list) => {
  for (const o of list) {
    const {_id,...data} = o;
    await addDoc(collection(db,"orders_archive"),{...data, archivedAt:Date.now()});
    await deleteDoc(doc(db,"orders",_id));
  }
};

// Daily auto-clear at 23:59
const scheduleDailyClean = () => {
  const n=new Date(), next=new Date(n);
  next.setHours(23,59,0,0);
  if(next<=n) next.setDate(next.getDate()+1);
  setTimeout(async()=>{
    const snap=await getDocs(collection(db,"orders"));
    const all=snap.docs.map(d=>({_id:d.id,...d.data()}));
    if(all.length) await archiveAndDelete(all);
    scheduleDailyClean();
  }, next-n);
};
scheduleDailyClean();

function e(tag, props, ...kids) {
  const el = document.createElement(tag);
  for (const [k,v] of Object.entries(props||{})) {
    if(k==="style") el.style.cssText=v;
    else if(k==="class") el.className=v;
    else if(k.startsWith("on")) el.addEventListener(k.slice(2),v);
    else if(k==="disabled"&&v) el.disabled=true;
    else if(k==="value") el.value=v;
    else if(k==="placeholder") el.placeholder=v;
    else if(k==="type") el.type=v;
    else if(k==="rows") el.rows=v;
    else if(k==="min") el.min=v;
    else el.setAttribute(k,v);
  }
  for (const k of kids.flat(Infinity)) {
    if(k==null||k===false) continue;
    el.append(typeof k==="string"?document.createTextNode(k):k);
  }
  return el;
}

}

      e("div",{style:"font-size:20px;color:#fde68a;margin-top:4px;"},"天主教耕莘醫療財團法人耕莘醫院 供應室")
    ));

    // 管理入口（右上小按鈕）
    const mgBtn=e("button",{style:"position:fixed;top:14px;right:14px;background:rgba(255,255,255,.25);color:#fff;border:none;border-radius:8px;padding:8px 12px;font-size:20px;font-weight:700;z-index:20;",onclick:()=>{const pw=prompt("請輸入供應室密碼：");if(pw==="2600"){S.view="vendor_cssd";render();}else if(pw!==null)alert("密碼錯誤！");}},
      "📋 管理"
    );
    root.append(mgBtn);

    if(VF.done){
      root.append(e("div",{style:"display:flex;flex-direction:column;align-items:center;justify-content:center;padding:60px 20px;text-align:center;"},
        e("div",{style:"font-size:80px;margin-bottom:16px;"},"✅"),
        e("div",{style:"font-size:28px;font-weight:900;color:#065f46;margin-bottom:8px;"},"送洗申請已送出！"),
        e("div",{style:"font-size:22px;color:#6b7280;margin-bottom:24px;"},"供應室已收到通知，謝謝！"),
        e("button",{style:"padding:16px 40px;background:#b45309;color:#fff;border:none;border-radius:14px;font-size:24px;font-weight:800;",onclick:()=>{VF={date:today(),time:"",vendorName:"",contact:"",phone:"",itemType:"",useDate:"",done:false};rerender();}},"再次登記"),
        e("button",{style:"margin-top:10px;padding:12px 40px;background:#fff;color:#b45309;border:2px solid #b45309;border-radius:14px;font-size:22px;font-weight:700;",onclick:()=>{S.view="home";render();}},"返回首頁")
      ));
      return root;
    }

    const body=e("div",{style:"padding:20px 16px 60px;"});

    // Card wrapper
    const card=e("div",{style:"background:#fff;border-radius:20px;padding:24px;box-shadow:0 4px 20px rgba(180,83,9,.1);border:2px solid #fed7aa;"});

    const field=(icon,label,req,content)=>{
      const wrap=e("div",{style:"margin-bottom:20px;"});
      wrap.append(e("div",{style:"display:flex;align-items:center;gap:8px;margin-bottom:8px;"},
        e("span",{style:"font-size:22px;"},icon),
        e("span",{style:"font-size:22px;font-weight:800;color:#1e293b;"},label),
        req?e("span",{style:"color:#ef4444;font-size:18px;"},"*"):null
      ));
      wrap.append(content);
      return wrap;
    };

    const inp=(ph,val,key,type="text")=>{
      const el=e("input",{type,style:"width:100%;padding:14px 16px;border:2px solid #e5e7eb;border-radius:12px;font-size:22px;font-family:inherit;background:#f9fafb;",placeholder:ph,value:val});
      el.addEventListener("input",ev=>{VF[key]=ev.target.value;});
      el.addEventListener("change",ev=>{VF[key]=ev.target.value;});
      return el;
    };

    // 日期時間一排
    const dateTimeRow=e("div",{style:"display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:20px;"});
    dateTimeRow.append(
      e("div",{},
        e("div",{style:"display:flex;align-items:center;gap:6px;margin-bottom:8px;"},e("span",{},"📅"),e("span",{style:"font-size:22px;font-weight:800;"},"寄銷日期"),e("span",{style:"color:#ef4444;font-size:18px;"},"*")),
        inp("",VF.date,"date","date")
      ),
      e("div",{},
        e("div",{style:"display:flex;align-items:center;gap:6px;margin-bottom:8px;"},e("span",{},"🕐"),e("span",{style:"font-size:22px;font-weight:800;"},"時間"),e("span",{style:"color:#ef4444;font-size:18px;"},"*")),
        inp("14:30",VF.time,"time")
      )
    );
    card.append(dateTimeRow);

    card.append(field("🏭","廠商名稱",true,inp("請輸入廠商名稱",VF.vendorName,"vendorName")));
    
    // 聯絡人電話一排
    const contactRow=e("div",{style:"display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:20px;"});
    contactRow.append(
      e("div",{},
        e("div",{style:"display:flex;align-items:center;gap:6px;margin-bottom:8px;"},e("span",{},"👤"),e("span",{style:"font-size:22px;font-weight:800;"},"聯絡人"),e("span",{style:"color:#ef4444;font-size:18px;"},"*")),
        inp("聯絡人姓名",VF.contact,"contact")
      ),
      e("div",{},
        e("div",{style:"display:flex;align-items:center;gap:6px;margin-bottom:8px;"},e("span",{},"📞"),e("span",{style:"font-size:22px;font-weight:800;"},"電話"),e("span",{style:"color:#ef4444;font-size:18px;"},"*")),
        inp("聯絡電話",VF.phone,"phone")
      )
    );
    card.append(contactRow);

    card.append(field("🔧","器械種類",true,inp("請輸入器械種類名稱",VF.itemType,"itemType")));
    card.append(field("📆","器械預計使用日期",true,inp("",VF.useDate,"useDate","date")));

    body.append(card);

    const canSubmit=VF.vendorName&&VF.contact&&VF.phone&&VF.itemType&&VF.useDate;
    const btn=e("button",{
      style:"width:100%;margin-top:16px;padding:18px;background:"+(canSubmit?"linear-gradient(135deg,#b45309,#d97706)":"#9ca3af")+";color:#fff;border:none;border-radius:14px;font-size:26px;font-weight:900;",
      onclick:async()=>{
        if(!canSubmit){alert("請填寫所有必填欄位（*）");return;}
        try{
          await addDoc(collection(db,"vendor_orders"),{date:VF.date,time:VF.time,vendorName:VF.vendorName,contact:VF.contact,phone:VF.phone,itemType:VF.itemType,useDate:VF.useDate,status:"待處理",ts:Date.now(),time2:now()});
          VF.done=true;rerender();
        }catch(err){alert("送出失敗："+err.message);}
      }
    },"送出送洗申請 →");
    body.append(btn);
    if(!canSubmit) body.append(e("p",{style:"text-align:center;color:#9ca3af;font-size:20px;margin-top:8px;"},"請填寫所有 * 必填欄位"));

    root.append(body);
    return root;
  }
  function rerender(){const app=document.getElementById("app");app.innerHTML="";app.append(build());}
  return build();
}

/* ─── VENDOR CSSD ─── */
function renderVendorCssd() {
  const root=e("div",{style:"min-height:100vh;background:#f1f5f9;"});
  root.append(e("div",{style:"background:#b45309;color:#fff;padding:14px 16px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:10;"},
    e("button",{style:"background:rgba(255,255,255,.2);color:#fff;border:none;border-radius:8px;padding:8px 14px;font-size:26px;font-weight:700;",onclick:()=>{S.view="home";render();}},"← 返回"),
    e("div",{style:"font-size:26px;font-weight:800;"},"🏭 廠商送洗管理"),
    e("button",{style:"background:rgba(255,255,255,.2);color:#fff;border:none;border-radius:8px;padding:8px 14px;font-size:26px;font-weight:700;",onclick:()=>{S.view="home";render();}},"🏠 首頁")
  ));
  const body=e("div",{style:"padding:14px 14px 50px;"});
  body.append(e("div",{style:"text-align:center;color:#9ca3af;padding:40px;font-size:26px;"},"⏳ 載入中…"));
  root.append(body);
  onSnapshot(query(collection(db,"vendor_orders"),orderBy("ts","desc")),snap=>{
    body.innerHTML="";
    const orders=snap.docs.map(d=>({_id:d.id,...d.data()}));
    if(!orders.length){body.append(e("div",{style:"text-align:center;color:#9ca3af;padding:40px;font-size:26px;"},"目前沒有廠商送洗記錄"));return;}
    orders.forEach(o=>{
      const card=e("div",{style:"background:#fff;border-radius:12px;padding:14px;margin-bottom:10px;box-shadow:0 1px 5px rgba(0,0,0,.07);border-left:5px solid "+(o.status==="已完成"?"#10b981":"#b45309")+";"});
      card.append(e("div",{style:"display:flex;justify-content:space-between;margin-bottom:8px;"},e("span",{style:"background:"+(o.status==="已完成"?"#10b981":"#b45309")+";color:#fff;font-size:22px;font-weight:700;padding:4px 12px;border-radius:10px;"},o.status||"待處理"),e("span",{style:"font-size:20px;color:#9ca3af;"},o.time2||"")));
      card.append(e("div",{style:"font-size:24px;font-weight:800;color:#1e293b;margin-bottom:4px;"},"🏭 "+o.vendorName));
      card.append(e("div",{style:"font-size:22px;color:#374151;margin-bottom:4px;"},"👤 "+o.contact+"　📞 "+o.phone));
      card.append(e("div",{style:"font-size:22px;color:#374151;margin-bottom:4px;"},"🔧 "+o.itemType));
      card.append(e("div",{style:"font-size:22px;color:#374151;margin-bottom:10px;"},"📅 寄銷："+o.date+(o.time?" "+o.time:"")+"　預計使用："+o.useDate));
      if(o.status!=="已完成"){card.append(e("button",{style:"width:100%;padding:14px;border:none;border-radius:10px;background:#10b981;color:#fff;font-size:26px;font-weight:900;",onclick:()=>updateDoc(doc(db,"vendor_orders",o._id),{status:"已完成"})},"✅ 已完成"));}
      else{card.append(e("div",{style:"width:100%;padding:14px;border-radius:10px;background:#f0fdf4;color:#10b981;font-size:26px;font-weight:900;text-align:center;border:2px solid #86efac;"},"✅ 已完成"));}
      body.append(card);
    });
  });
  return root;
}

render();
</script>
</body>
</html>
