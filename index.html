const archiveAndDelete = async (ordersToDelete) => {
  for (const o of ordersToDelete) {
    const {_id, ...data} = o;
    await addDoc(collection(db,"orders_archive"), {...data, archivedAt: Date.now()});
    await deleteDoc(doc(db,"orders",_id));
  }
};

// ── 每日 23:59 自動清除所有資料（備份到 orders_archive）
const scheduleDailyClean = () => {
  const now2 = new Date();
  const next = new Date(now2);
  next.setHours(23, 59, 0, 0);
  if (next <= now2) next.setDate(next.getDate()+1);
  const ms = next - now2;
  setTimeout(async () => {
    const snap = await getDocs(collection(db,"orders"));
    const all = snap.docs.map(d=>({_id:d.id,...d.data()}));
    if (all.length > 0) await archiveAndDelete(all);
    scheduleDailyClean(); // 排下一天
  }, ms);
};
scheduleDailyClean();

function e(tag, props, ...kids) {
  const el = document.createElement(tag);
  for (const [k,v] of Object.entries(props||{})) {
    if (k==="style") el.style.cssText = v;
    else if (k==="class") el.className = v;
    else if (k.startsWith("on")) el.addEventListener(k.slice(2), v);
    else if (k==="disabled"&&v) el.disabled = true;
    else if (k==="value") el.value = v;
    else if (k==="placeholder") el.placeholder = v;
    else if (k==="type") el.type = v;
    else if (k==="rows") el.rows = v;
    else if (k==="min") el.min = v;
    else el.setAttribute(k, v);
  }
  for (const k of kids.flat(Infinity)) {
    if (k==null||k===false) continue;
    el.append(typeof k==="string" ? document.createTextNode(k) : k);
  }
  return el;
}

}

function renderCssd() {
  let utF="全部", urgO=false, showExp=false, tabF="全部";
  let dFrom=today(), dTo=today();

  function build() {
    const CLOTH_ONLY_CHECK = new Set(["洞巾","治療巾","洞巾(小)","CVC布包","產包","大包(一)","大包(二)","衣服包(三)","大衣(一件)","GU衣","中包布","OPD包","長腳套","GU包","皮膚包","手腳蓋單","ENT洞巾包","心導管檢查包","早產包布","大產包","小產包","綁帶","消毒包","毛巾包"]);
    const CLOTH_ONLY = CLOTH_ONLY_CHECK;
    const getClothItems = o => (o.items||[]).filter(it => CLOTH_ONLY.has(it.label));
    const getOtherItems = o => (o.items||[]).filter(it => !CLOTH_ONLY.has(it.label));

    const orders = S.orders;
    const sorted = [...orders].sort((a,b)=>{
      if(a.urgent==="急件"&&b.urgent!=="急件") return -1;
      if(b.urgent==="急件"&&a.urgent!=="急件") return 1;
      return (b.ts||0)-(a.ts||0);
    });

    // 篩選基本條件
    const baseShown = sorted.filter(o=>{
      if(utF!=="全部"&&o.unitId!==utF) return false;
      if(urgO&&o.urgent!=="急件") return false;
      return true;
    });

    // 各tab顯示的單和品項
    const shown = baseShown.filter(o=>{
      if(tabF==="包布類") return getClothItems(o).length > 0;
      if(tabF==="管帶區") return getOtherItems(o).length > 0;
      return true;
    });

    // 根據tab決定顯示哪些品項
    const getDisplayItems = (o) => {
      if(tabF==="包布類") return getClothItems(o);
      if(tabF==="管帶區") return getOtherItems(o);
      return o.items||[];
    };

    const root = e("div",{style:"min-height:100vh;background:#f1f5f9;"});
    root.append(e("div",{style:"background:#1e293b;color:#fff;padding:14px 16px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:10;"},
      e("button",{style:"background:rgba(255,255,255,.15);color:#fff;border:none;border-radius:8px;padding:8px 14px;font-size:30px;font-weight:700;",onclick:()=>{S.view="home";render();}},"← 返回"),
      e("div",{style:"font-size:30px;font-weight:800;"},"📋 供應室管理"),
      e("div",{style:"display:flex;gap:8px;"},
        e("button",{style:"background:rgba(239,68,68,.3);color:#fff;border:none;border-radius:8px;padding:8px 12px;font-size:30px;font-weight:700;",
          onclick: async () => {
            const CLOTH_SET = new Set(["洞巾","治療巾","洞巾(小)","CVC布包","產包","大包(一)","大包(二)","衣服包(三)","大衣(一件)","GU衣","中包布","OPD包","長腳套","GU包","皮膚包","手腳蓋單","ENT洞巾包","心導管檢查包","早產包布","大產包","小產包","綁帶","消毒包","毛巾包"]);
            const done = S.orders.filter(o=>{
              const ci = (o.items||[]).filter(it => CLOTH_SET.has(it.label));
              const oi = (o.items||[]).filter(it => !CLOTH_SET.has(it.label));
              const clothOk = ci.length===0 || o.statusCloth==="等待送回" || o.statusCloth===true;
              const otherOk = oi.length===0 || o.statusOther==="等待送回" || o.statusOther===true;
              return clothOk && otherOk;
            });
            // 除錯：顯示每筆的狀態
            const debugInfo = S.orders.map(o=>"sub:"+o.sub+" cloth:"+JSON.stringify(o.statusCloth)+" other:"+JSON.stringify(o.statusOther)).join("\n");
            alert("目前狀態：\n"+debugInfo);
            if (!done.length) { alert("目前沒有兩邊都到等待送回的記錄"); return; }

            await archiveAndDelete(done);

        e("button",{style:"background:rgba(16,185,129,.25);color:#fff;border:none;border-radius:8px;padding:8px 12px;font-size:30px;font-weight:700;",onclick:()=>{showExp=!showExp;rerender();}},"📥 報表")
      )

    const body = e("div",{style:"padding:12px 12px 50px;"});

    if (showExp) {
      const expBox = e("div",{style:"background:#fff;border:2px solid #10b981;border-radius:12px;padding:14px;margin-bottom:12px;"});
      expBox.append(e("div",{style:"font-size:30px;font-weight:800;color:#065f46;margin-bottom:4px;"},"📥 下載 CSV 報表"));
      expBox.append(e("div",{style:"font-size:30px;color:#6b7280;margin-bottom:10px;"},"匯出後可直接用 Excel 開啟"));
      const quickRow = e("div",{style:"display:flex;gap:8px;margin-bottom:10px;flex-wrap:wrap;"});
      [["今天","today"],["本週","week"],["本月","month"]].forEach(([label,key]) => {
        quickRow.append(e("button",{
          style:"padding:8px 16px;border:2px solid #10b981;border-radius:20px;background:#ecfdf5;color:#065f46;font-size:30px;font-weight:700;",
          onclick: () => {
            const t=new Date(),p=n=>String(n).padStart(2,"0"),fmt=d=>d.getFullYear()+"-"+p(d.getMonth()+1)+"-"+p(d.getDate());
            if(key==="today"){dFrom=fmt(t);dTo=fmt(t);}
            if(key==="week"){const m=new Date(t);m.setDate(t.getDate()-t.getDay()+1);dFrom=fmt(m);dTo=fmt(t);}
            if(key==="month"){dFrom=fmt(new Date(t.getFullYear(),t.getMonth(),1));dTo=fmt(t);}
            rerender();
          }
        }, label));
      });
      expBox.append(quickRow);
      const dateRow = e("div",{style:"display:flex;gap:8px;align-items:center;margin-bottom:10px;flex-wrap:wrap;"});
      const dFromInput = e("input",{type:"date",style:"border:2px solid #d1d5db;border-radius:8px;padding:8px 10px;font-size:30px;font-family:inherit;",value:dFrom});
      const dToInput   = e("input",{type:"date",style:"border:2px solid #d1d5db;border-radius:8px;padding:8px 10px;font-size:30px;font-family:inherit;",value:dTo});
      dFromInput.addEventListener("change", ev=>{dFrom=ev.target.value;rerender();});
      dToInput.addEventListener("change",   ev=>{dTo=ev.target.value;rerender();});
      dateRow.append(e("span",{style:"font-size:30px;font-weight:700;"},"從"), dFromInput, e("span",{style:"font-size:30px;font-weight:700;"},"至"), dToInput);
      expBox.append(dateRow);
      const expCount = orders.filter(o=>{const d=(o.time||"").slice(0,10).replace(/\//g,"-");return(!dFrom||d>=dFrom)&&(!dTo||d<=dTo);}).length;
      expBox.append(e("div",{style:"background:#f0fdf4;border:1px solid #bbf7d0;border-radius:8px;padding:8px 12px;font-size:30px;color:#166534;margin-bottom:10px;font-weight:700;"},expCount>0?"共 "+expCount+" 筆記錄符合條件":"⚠️ 所選範圍內沒有資料"));

      // 兩個下載按鈕
      const dlRow = e("div",{style:"display:flex;gap:8px;"});

      // 明細 CSV（依單位分組，包含 archive）
      dlRow.append(e("button",{
        style:"flex:1;padding:12px;background:#10b981;color:#fff;border:none;border-radius:10px;font-size:30px;font-weight:800;",
        onclick: async () => {
          const archSnap = await getDocs(collection(db,"orders_archive"));
          const archOrders = archSnap.docs.map(d=>({_id:d.id,...d.data()}));
          const allOrders = [...orders, ...archOrders];
          const filtered = allOrders.filter(o=>{const d=(o.time||"").slice(0,10).replace(/\//g,"-");return(!dFrom||d>=dFrom)&&(!dTo||d<=dTo);});
          if(!filtered.length){alert("所選範圍內沒有資料");return;}

          // 依單位類型+子單位分組
          const groups = {};
          filtered.forEach(o=>{
            const key = (o.unitLabel||"其他")+"_"+(o.sub||"");
            if(!groups[key]) groups[key]={unitLabel:o.unitLabel||"",sub:o.sub||"",orders:[]};
            groups[key].orders.push(o);
          });

          let csv="\uFEFF";
          Object.values(groups).forEach(g=>{
            // 群組標題
            csv+='"【'+g.unitLabel+" - "+g.sub+'】"\r\n';
            csv+='"單號","時間","送洗單位","緊急程度","器械名稱","數量","備註"\r\n';
            g.orders.forEach(o=>{
              (o.items||[]).forEach((it,i)=>{
                csv+=[
                  i===0?'"'+(o._id||"")+'"':'""',
                  i===0?'"'+(o.time||"")+'"':'""',
                  i===0?'"'+(o.sub||"")+'"':'""',
                  i===0?'"'+(o.urgent||"")+'"':'""',
                  '"'+it.label+'"',
                  '"'+it.qty+'"',
                  i===0?'"'+(o.note||"")+'"':'""'
                ].join(",")+"\r\n";
              });
            });
            csv+="\r\n"; // 群組之間空行
          });

          const a=document.createElement("a");
          a.href=URL.createObjectURL(new Blob([csv],{type:"text/csv;charset=utf-8;"}));
          a.download="CSSD_依單位_"+dFrom+"_"+dTo+".csv";
          a.click();
        }
      },"⬇️ 下載明細（依單位）"));

      // 品項統計 CSV
      dlRow.append(e("button",{
        style:"flex:1;padding:12px;background:#7c3aed;color:#fff;border:none;border-radius:10px;font-size:30px;font-weight:800;",
        onclick: async () => {
          const archSnap2 = await getDocs(collection(db,"orders_archive"));
          const archOrders2 = archSnap2.docs.map(d=>({_id:d.id,...d.data()}));
          const allOrders2 = [...orders, ...archOrders2];
          const filtered = allOrders2.filter(o=>{const d=(o.time||"").slice(0,10).replace(/\//g,"-");return(!dFrom||d>=dFrom)&&(!dTo||d<=dTo);});
          if(!filtered.length){alert("所選範圍內沒有資料");return;}

          // 依單位分組統計
          const groups = {};
          filtered.forEach(o=>{
            const key = (o.unitLabel||"其他")+"_"+(o.sub||"");
            if(!groups[key]) groups[key]={unitLabel:o.unitLabel||"",sub:o.sub||"",totals:{}};
            (o.items||[]).forEach(it=>{
              groups[key].totals[it.label]=(groups[key].totals[it.label]||0)+Number(it.qty);
            });
          });

          let csv="\uFEFF";
          Object.values(groups).forEach(g=>{
            csv+='"【'+g.unitLabel+" - "+g.sub+'】"\r\n';
            csv+='"器械名稱","總數量"\r\n';
            Object.entries(g.totals).sort((a,b)=>b[1]-a[1]).forEach(([label,qty])=>{
              csv+='"'+label+'","'+qty+'"\r\n';
            });
            csv+="\r\n";
          });

          const a=document.createElement("a");
          a.href=URL.createObjectURL(new Blob([csv],{type:"text/csv;charset=utf-8;"}));
          a.download="CSSD_品項統計_依單位_"+dFrom+"_"+dTo+".csv";
          a.click();
        }
      },"📊 下載品項統計"));

      expBox.append(dlRow);
      body.append(expBox);
    }

    // Tab 按鈕
    const tabRow = e("div",{style:"display:flex;gap:10px;margin-bottom:12px;"});
    [["全部","#1e293b"],["包布類","#f59e0b"],["管帶區","#2563eb"]].forEach(([tab,color]) => {
      tabRow.append(e("button",{
        style:"flex:1;padding:14px;border:none;border-radius:12px;font-size:30px;font-weight:900;background:"+(tabF===tab?color:"#fff")+";color:"+(tabF===tab?"#fff":"#374151")+";box-shadow:0 2px 6px rgba(0,0,0,.08);",
        onclick:()=>{tabF=tab;rerender();}
      }, tab==="包布類"?"🧺 包布類":tab==="管帶區"?"🔧 管帶區":"📋 全部"));
    });
    body.append(tabRow);

    // Filters
    const filterBox = e("div",{style:"background:#fff;border-radius:12px;padding:12px;margin-bottom:12px;box-shadow:0 1px 4px rgba(0,0,0,.07);"});
    const utRow = e("div",{style:"display:flex;gap:6px;flex-wrap:wrap;"});
    utRow.append(e("button",{
      style:"padding:7px 12px;border:"+(utF==="全部"?"none":"2px solid #d1d5db")+";border-radius:20px;background:"+(utF==="全部"?"#1e293b":"#f9fafb")+";color:"+(utF==="全部"?"#fff":"#374151")+";font-size:30px;font-weight:700;",
      onclick:()=>{utF="全部";rerender();}
    },"全部單位"));
    UNITS.forEach(u => {
      utRow.append(e("button",{
        style:"padding:7px 12px;border:"+(utF===u.id?"none":"2px solid #d1d5db")+";border-radius:20px;background:"+(utF===u.id?u.color:"#f9fafb")+";color:"+(utF===u.id?"#fff":"#374151")+";font-size:30px;font-weight:700;",
        onclick:()=>{utF=u.id;rerender();}
      }, u.icon+" "+u.label));
    });
    utRow.append(e("button",{
      style:"padding:7px 12px;border:"+(urgO?"none":"2px solid #d1d5db")+";border-radius:20px;background:"+(urgO?"#ef4444":"#f9fafb")+";color:"+(urgO?"#fff":"#374151")+";font-size:30px;font-weight:700;",
      onclick:()=>{urgO=!urgO;rerender();}
    },"🔴 急件"));
    filterBox.append(utRow);
    body.append(filterBox);

    if (!shown.length) body.append(e("div",{style:"text-align:center;color:#9ca3af;padding:48px 0;font-size:30px;"},"目前沒有符合條件的記錄"));

    const makeCard = (order, displayItems, section) => {
      const u2=uInfo(order.unitId);
      const clothItems = (order.items||[]).filter(it => CLOTH_ONLY.has(it.label));
      const otherItems = (order.items||[]).filter(it => !CLOTH_ONLY.has(it.label));
      const clothDone = clothItems.length===0 || order.statusCloth==="等待送回" || order.statusCloth===true;
      const otherDone = otherItems.length===0 || order.statusOther==="等待送回" || order.statusOther===true;

      // 各區塊的完成狀態
      let isDone;
      if (section==="包布類") isDone = order.statusCloth==="等待送回" || order.statusCloth===true;
      else if (section==="管帶區") isDone = order.statusOther==="等待送回" || order.statusOther===true;
      else isDone = clothDone && otherDone; // 全部：兩邊都完成才算

      const statusColor = isDone ? "#10b981" : "f59e0b";
      const card = e("div",{style:"background:#fff;border-radius:12px;padding:14px;margin-bottom:10px;box-shadow:0 1px 5px rgba(0,0,0,.08);border-left:5px solid "+(order.urgent==="急件"?"#ef4444":isDone?"#10b981":"#f59e0b")+";"});
      const cardHdr = e("div",{style:"display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:8px;"});
      const badges = e("div",{style:"display:flex;gap:6px;flex-wrap:wrap;"});
      badges.append(
        e("span",{style:"background:"+u2.color+";color:#fff;font-size:30px;font-weight:700;padding:4px 10px;border-radius:14px;"},u2.icon+" "+u2.label)
      );
      if(order.urgent==="急件") badges.append(e("span",{style:"background:#ef4444;color:#fff;font-size:30px;font-weight:700;padding:4px 10px;border-radius:14px;"},"🔴 急件"));
      cardHdr.append(badges, e("span",{style:"font-size:30px;color:#9ca3af;white-space:nowrap;margin-left:4px;"},order.time||""));
      card.append(cardHdr);
      card.append(e("div",{style:"font-size:30px;color:#374151;margin-bottom:8px;font-weight:600;"},"📍 "+(order.sub||"")));
      const itemList = e("div",{style:"display:flex;flex-wrap:wrap;gap:5px;margin-bottom:8px;"});
      displayItems.forEach(it=>itemList.append(e("span",{style:"border:2px solid "+u2.color+";border-radius:8px;padding:4px 10px;font-size:30px;font-weight:700;color:"+u2.color+";"},it.label+" × "+it.qty)));
      card.append(itemList);
      if(order.note) card.append(e("div",{style:"font-size:30px;color:#6b7280;margin-bottom:8px;font-style:italic;"},"📝 "+order.note));
      const stRow2 = e("div",{style:"display:flex;gap:8px;"});

      if (section==="全部") {
        // 包布狀態按鈕
        if (clothItems.length>0) {
          if (!order.statusCloth) {
            stRow2.append(e("button",{
              style:"flex:1;padding:14px;border:none;border-radius:10px;background:#f59e0b;color:#fff;font-size:24px;font-weight:900;",
              onclick: () => updateDoc(doc(db,"orders",order._id),{statusCloth:"已完成"})
            },"🧺 包布完成"));
          } else if (order.statusCloth==="已完成") {
            stRow2.append(e("button",{
              style:"flex:1;padding:14px;border:none;border-radius:10px;background:#0891b2;color:#fff;font-size:24px;font-weight:900;",
              onclick: () => updateDoc(doc(db,"orders",order._id),{statusCloth:"等待送回"})
            },"🧺 包布→送回"));
          } else {
            stRow2.append(e("div",{style:"flex:1;padding:14px;border-radius:10px;background:#ecfeff;color:#0891b2;font-size:24px;font-weight:900;text-align:center;border:2px solid #a5f3fc;"},"🧺 等待送回"));
          }
        }
        // 管帶狀態按鈕
        if (otherItems.length>0) {
          if (!order.statusOther) {
            stRow2.append(e("button",{
              style:"flex:1;padding:14px;border:none;border-radius:10px;background:#2563eb;color:#fff;font-size:24px;font-weight:900;",
              onclick: () => updateDoc(doc(db,"orders",order._id),{statusOther:"已完成"})
            },"🔧 管帶完成"));
          } else if (order.statusOther==="已完成") {
            stRow2.append(e("button",{
              style:"flex:1;padding:14px;border:none;border-radius:10px;background:#0891b2;color:#fff;font-size:24px;font-weight:900;",
              onclick: () => updateDoc(doc(db,"orders",order._id),{statusOther:"等待送回"})
            },"🔧 管帶→送回"));
          } else {
            stRow2.append(e("div",{style:"flex:1;padding:14px;border-radius:10px;background:#ecfeff;color:#0891b2;font-size:24px;font-weight:900;text-align:center;border:2px solid #a5f3fc;"},"🔧 等待送回"));
          }
        }
      } else {
        if (!isDone) {
          stRow2.append(e("button",{
            style:"flex:1;padding:14px;border:none;border-radius:10px;background:#10b981;color:#fff;font-size:30px;font-weight:900;",
            onclick: () => {
              const update = {};
              if (section==="包布類") update.statusCloth = true;
              else if (section==="管帶區") update.statusOther = true;
              updateDoc(doc(db,"orders",order._id), update);
            }
          }, "✅ 已完成"));
        } else {
          stRow2.append(e("div",{style:"flex:1;padding:14px;border-radius:10px;background:#f0fdf4;color:#10b981;font-size:30px;font-weight:900;text-align:center;border:2px solid #86efac;"},"✅ 已完成"));
        }
      }
      card.append(stRow2);
      return card;
    };

    shown.forEach(order => body.append(makeCard(order, getDisplayItems(order), tabF)));

    root.append(body);
    return root;
  }

  function rerender() {
    const app = document.getElementById("app");
    app.innerHTML = "";
    app.append(build());
  }
  return build();
}

/* ─── HISTORY ─── */
async function renderHistory() {
  const sub = S.histSub;
  const unitId = S.histUnitId;
  const u = uInfo(unitId);

  const root = e("div",{style:"min-height:100vh;background:#f1f5f9;"});
  root.append(e("div",{style:"background:"+u.color+";color:#fff;padding:14px 16px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:10;"},
    e("button",{style:"background:rgba(255,255,255,.2);color:#fff;border:none;border-radius:8px;padding:8px 14px;font-size:30px;font-weight:700;",onclick:()=>{S.view="home";render();}},"← 返回"),
    e("div",{style:"font-size:30px;font-weight:800;"},u.icon+" "+sub+" 歷史申請"),
    e("div",{style:"width:80px;"})
  ));

  const body = e("div",{style:"padding:14px 14px 50px;"});
  root.append(body);

  const loading = e("div",{style:"text-align:center;color:#9ca3af;padding:40px;font-size:30px;"},"⏳ 載入中…");
  body.append(loading);

  const [snap1, snap2] = await Promise.all([
    getDocs(collection(db,"orders")),
    getDocs(collection(db,"orders_archive"))
  ]);
  const all = [
    ...snap1.docs.map(d=>({_id:d.id,...d.data()})),
    ...snap2.docs.map(d=>({_id:d.id,...d.data()}))
  ].filter(o=>o.sub===sub && o.unitId===unitId)
   .sort((a,b)=>(b.ts||0)-(a.ts||0));

  loading.remove();

  if (!all.length) {
    body.append(e("div",{style:"text-align:center;color:#9ca3af;padding:40px;font-size:30px;"},"尚無歷史申請記錄"));
    return root;
  }

  body.append(e("div",{style:"font-size:26px;color:#6b7280;margin-bottom:14px;"},"共 "+all.length+" 筆記錄"));

  all.forEach(o => {
    const card = e("div",{style:"background:#fff;border-radius:12px;padding:14px;margin-bottom:10px;box-shadow:0 1px 5px rgba(0,0,0,.06);"});
    card.append(e("div",{style:"display:flex;justify-content:space-between;margin-bottom:8px;"},
      e("span",{style:"font-size:26px;font-weight:800;color:#1e293b;"},o.urgent==="急件"?"🔴 急件":"🟢 一般"),
      e("span",{style:"font-size:24px;color:#9ca3af;"},o.time||"")
    ));
    const itemList = e("div",{style:"display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px;"});
    (o.items||[]).forEach(it=>itemList.append(
      e("span",{style:"border:2px solid "+u.color+";border-radius:8px;padding:4px 10px;font-size:26px;font-weight:700;color:"+u.color+";"},it.label+" × "+it.qty)
    ));
    card.append(itemList);
    if(o.note) card.append(e("div",{style:"font-size:24px;color:#6b7280;font-style:italic;"},"📝 "+o.note));
    body.append(card);
  });

  return root;
}

render();
</script>
</body>
