<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CSSD Link</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: system-ui, "PingFang TC", "Microsoft JhengHei", sans-serif; background: #eef2f7; font-size: 17px; }
input[type=number]::-webkit-inner-spin-button { -webkit-appearance: none; }
input[type=number] { -moz-appearance: textfield; }
button { cursor: pointer; font-family: inherit; }
:root { --cols-unit: 4; --cols-cat: 4; --cols-item: 3; }
/* ── 自適應版面：依手機、平板、電腦螢幕寬度調整 ── */
@media (min-width: 520px)  { :root { --cols-item: 4; } }
@media (min-width: 768px)  { :root { --cols-unit: 8;  --cols-cat: 6; --cols-item: 5; } }
@media (min-width: 1024px) { :root { --cols-item: 6; } }
@media (min-width: 1200px) { :root { --cols-unit: 12; --cols-cat: 8; --cols-item: 8; } }
#app { max-width: 1280px; margin: 0 auto; }                 /* 大螢幕不要撐得太開 */
@media (max-width: 599px) { #app { zoom: .86; } }           /* 手機：整體略縮，標題列不換行 */
#app [style*="sticky"] > button { white-space: nowrap; min-height: 50px; }    /* 頂端列按鈕不換行、好按 */
/* 品項格：正方形，內容放不下時自動長高；選取後「數字在上、－＋在下」兩排，按鈕夠大 */
.itile { padding-bottom: 0 !important; aspect-ratio: 1 / 1; }
.itile > div:first-child { position: static !important; height: auto; min-height: 100%; padding: 8px 4px !important; gap: 4px; }
.itile:has(.qrow) { aspect-ratio: auto; }                   /* 選取的格子依內容長高 */
.qrow { display: grid !important; grid-template-columns: 1fr 1fr; gap: 4px !important; width: 100%; max-width: 150px; padding: 0 1px; }
.qrow .qi { grid-column: 1 / 3; grid-row: 1; width: 100% !important; min-width: 0; height: 48px; }
.qrow .qb { width: 100% !important; height: 48px !important; border-radius: 12px !important; font-size: 24px !important; }
.ilabel { overflow-wrap: anywhere; }
/* ☆ 常用：加大可點範圍 */
.favbtn { width: 48px; height: 48px; top: 0 !important; right: 0 !important; display: flex; align-items: flex-start; justify-content: flex-end; padding: 4px 6px !important; font-size: 18px !important; }
/* 觸控螢幕：按鈕至少 44px，手指好按 */
.tapbig { min-width: 48px !important; min-height: 48px !important; }   /* 已選清單的 －＋✕ */
.qi, #app input[type=number] { min-height: 48px; }          /* 所有數量輸入框 */
.closebtn { min-width: 48px; min-height: 48px; }            /* 分類右上角的 ✕ */
</style>
<style>@keyframes redPulse{0%,100%{box-shadow:0 0 0 0 rgba(220,38,38,.55);}50%{box-shadow:0 0 0 10px rgba(220,38,38,0);}}
@keyframes pendPulse{0%,100%{box-shadow:0 0 0 0 rgba(245,158,11,.5);}50%{box-shadow:0 0 0 8px rgba(245,158,11,0);}}
input[type=number]::-webkit-outer-spin-button,input[type=number]::-webkit-inner-spin-button{-webkit-appearance:none;margin:0;}</style>
</head>
<body>
<div id="app"></div>
<script>
//---------------------------------------------------------------------

// QR Code Generator for JavaScript
//

// URL: http://www.d-project.com/

//  http://www.denso-wave.com/qrcode/faqpatent-e.html

var qrcode = function() {

  //---------------------------------------------------------------------
  // qrcode
  //---------------------------------------------------------------------

  /**
   * qrcode
   * @param typeNumber 1 to 40
   * @param errorCorrectionLevel 'L','M','Q','H'
   */
  var qrcode = function(typeNumber, errorCorrectionLevel) {

    var PAD0 = 0xEC;
    var PAD1 = 0x11;

    var _typeNumber = typeNumber;
    var _errorCorrectionLevel = QRErrorCorrectionLevel[errorCorrectionLevel];
    var _modules = null;
    var _moduleCount = 0;
    var _dataCache = null;
    var _dataList = [];

    var _this = {};

    var makeImpl = function(test, maskPattern) {

      _moduleCount = _typeNumber * 4 + 17;
      _modules = function(moduleCount) {
        var modules = new Array(moduleCount);
        for (var row = 0; row < moduleCount; row += 1) {
          modules[row] = new Array(moduleCount);
          for (var col = 0; col < moduleCount; col += 1) {
            modules[row][col] = null;
          }
        }
        return modules;
      }(_moduleCount);

      setupPositionProbePattern(0, 0);
      setupPositionProbePattern(_moduleCount - 7, 0);
      setupPositionProbePattern(0, _moduleCount - 7);
      setupPositionAdjustPattern();
      setupTimingPattern();
      setupTypeInfo(test, maskPattern);

      if (_typeNumber >= 7) {
        setupTypeNumber(test);
      }

      if (_dataCache == null) {
        _dataCache = createData(_typeNumber, _errorCorrectionLevel, _dataList);
      }

      mapData(_dataCache, maskPattern);
    };

    var setupPositionProbePattern = function(row, col) {

      for (var r = -1; r <= 7; r += 1) {

        if (row + r <= -1 || _moduleCount <= row + r) continue;

        for (var c = -1; c <= 7; c += 1) {

          if (col + c <= -1 || _moduleCount <= col + c) continue;

          if ( (0 <= r && r <= 6 && (c == 0 || c == 6) )
              || (0 <= c && c <= 6 && (r == 0 || r == 6) )
              || (2 <= r && r <= 4 && 2 <= c && c <= 4) ) {
            _modules[row + r][col + c] = true;
          } else {
            _modules[row + r][col + c] = false;
          }
        }
      }
    };

    var getBestMaskPattern = function() {

      var minLostPoint = 0;
      var pattern = 0;

      for (var i = 0; i < 8; i += 1) {

        makeImpl(true, i);

        var lostPoint = QRUtil.getLostPoint(_this);

        if (i == 0 || minLostPoint > lostPoint) {
          minLostPoint = lostPoint;
          pattern = i;
        }
      }

      return pattern;
    };

    var setupTimingPattern = function() {

      for (var r = 8; r < _moduleCount - 8; r += 1) {
        if (_modules[r][6] != null) {
          continue;
        }
        _modules[r][6] = (r % 2 == 0);
      }

      for (var c = 8; c < _moduleCount - 8; c += 1) {
        if (_modules[6][c] != null) {
          continue;
        }
        _modules[6][c] = (c % 2 == 0);
      }
    };

    var setupPositionAdjustPattern = function() {

      var pos = QRUtil.getPatternPosition(_typeNumber);

      for (var i = 0; i < pos.length; i += 1) {

        for (var j = 0; j < pos.length; j += 1) {

          var row = pos[i];
          var col = pos[j];

          if (_modules[row][col] != null) {
            continue;
          }

          for (var r = -2; r <= 2; r += 1) {

            for (var c = -2; c <= 2; c += 1) {

              if (r == -2 || r == 2 || c == -2 || c == 2
                  || (r == 0 && c == 0) ) {
                _modules[row + r][col + c] = true;
              } else {
                _modules[row + r][col + c] = false;
              }
            }
          }
        }
      }
    };

    var setupTypeNumber = function(test) {

      var bits = QRUtil.getBCHTypeNumber(_typeNumber);

      for (var i = 0; i < 18; i += 1) {
        var mod = (!test && ( (bits >> i) & 1) == 1);
        _modules[Math.floor(i / 3)][i % 3 + _moduleCount - 8 - 3] = mod;
      }

      for (var i = 0; i < 18; i += 1) {
        var mod = (!test && ( (bits >> i) & 1) == 1);
        _modules[i % 3 + _moduleCount - 8 - 3][Math.floor(i / 3)] = mod;
      }
    };

    var setupTypeInfo = function(test, maskPattern) {

      var data = (_errorCorrectionLevel << 3) | maskPattern;
      var bits = QRUtil.getBCHTypeInfo(data);

      // vertical
      for (var i = 0; i < 15; i += 1) {

        var mod = (!test && ( (bits >> i) & 1) == 1);

        if (i < 6) {
          _modules[i][8] = mod;
        } else if (i < 8) {
          _modules[i + 1][8] = mod;
        } else {
          _modules[_moduleCount - 15 + i][8] = mod;
        }
      }

      // horizontal
      for (var i = 0; i < 15; i += 1) {

        var mod = (!test && ( (bits >> i) & 1) == 1);

        if (i < 8) {
          _modules[8][_moduleCount - i - 1] = mod;
        } else if (i < 9) {
          _modules[8][15 - i - 1 + 1] = mod;
        } else {
          _modules[8][15 - i - 1] = mod;
        }
      }

      // fixed module
      _modules[_moduleCount - 8][8] = (!test);
    };

    var mapData = function(data, maskPattern) {

      var inc = -1;
      var row = _moduleCount - 1;
      var bitIndex = 7;
      var byteIndex = 0;
      var maskFunc = QRUtil.getMaskFunction(maskPattern);

      for (var col = _moduleCount - 1; col > 0; col -= 2) {

        if (col == 6) col -= 1;

        while (true) {

          for (var c = 0; c < 2; c += 1) {

            if (_modules[row][col - c] == null) {

              var dark = false;

              if (byteIndex < data.length) {
                dark = ( ( (data[byteIndex] >>> bitIndex) & 1) == 1);
              }

              var mask = maskFunc(row, col - c);

              if (mask) {
                dark = !dark;
              }

              _modules[row][col - c] = dark;
              bitIndex -= 1;

              if (bitIndex == -1) {
                byteIndex += 1;
                bitIndex = 7;
              }
            }
          }

          row += inc;

          if (row < 0 || _moduleCount <= row) {
            row -= inc;
            inc = -inc;
            break;
          }
        }
      }
    };

    var createBytes = function(buffer, rsBlocks) {

      var offset = 0;

      var maxDcCount = 0;
      var maxEcCount = 0;

      var dcdata = new Array(rsBlocks.length);
      var ecdata = new Array(rsBlocks.length);

      for (var r = 0; r < rsBlocks.length; r += 1) {

        var dcCount = rsBlocks[r].dataCount;
        var ecCount = rsBlocks[r].totalCount - dcCount;

        maxDcCount = Math.max(maxDcCount, dcCount);
        maxEcCount = Math.max(maxEcCount, ecCount);

        dcdata[r] = new Array(dcCount);

        for (var i = 0; i < dcdata[r].length; i += 1) {
          dcdata[r][i] = 0xff & buffer.getBuffer()[i + offset];
        }
        offset += dcCount;

        var rsPoly = QRUtil.getErrorCorrectPolynomial(ecCount);
        var rawPoly = qrPolynomial(dcdata[r], rsPoly.getLength() - 1);

        var modPoly = rawPoly.mod(rsPoly);
        ecdata[r] = new Array(rsPoly.getLength() - 1);
        for (var i = 0; i < ecdata[r].length; i += 1) {
          var modIndex = i + modPoly.getLength() - ecdata[r].length;
          ecdata[r][i] = (modIndex >= 0)? modPoly.getAt(modIndex) : 0;
        }
      }

      var totalCodeCount = 0;
      for (var i = 0; i < rsBlocks.length; i += 1) {
        totalCodeCount += rsBlocks[i].totalCount;
      }

      var data = new Array(totalCodeCount);
      var index = 0;

      for (var i = 0; i < maxDcCount; i += 1) {
        for (var r = 0; r < rsBlocks.length; r += 1) {
          if (i < dcdata[r].length) {
            data[index] = dcdata[r][i];
            index += 1;
          }
        }
      }

      for (var i = 0; i < maxEcCount; i += 1) {
        for (var r = 0; r < rsBlocks.length; r += 1) {
          if (i < ecdata[r].length) {
            data[index] = ecdata[r][i];
            index += 1;
          }
        }
      }

      return data;
    };

    var createData = function(typeNumber, errorCorrectionLevel, dataList) {

      var rsBlocks = QRRSBlock.getRSBlocks(typeNumber, errorCorrectionLevel);

      var buffer = qrBitBuffer();

      for (var i = 0; i < dataList.length; i += 1) {
        var data = dataList[i];
        buffer.put(data.getMode(), 4);
        buffer.put(data.getLength(), QRUtil.getLengthInBits(data.getMode(), typeNumber) );
        data.write(buffer);
      }

      // calc num max data.
      var totalDataCount = 0;
      for (var i = 0; i < rsBlocks.length; i += 1) {
        totalDataCount += rsBlocks[i].dataCount;
      }

      if (buffer.getLengthInBits() > totalDataCount * 8) {
        throw 'code length overflow. ('
          + buffer.getLengthInBits()
          + '>'
          + totalDataCount * 8
          + ')';
      }

      // end code
      if (buffer.getLengthInBits() + 4 <= totalDataCount * 8) {
        buffer.put(0, 4);
      }

      // padding
      while (buffer.getLengthInBits() % 8 != 0) {
        buffer.putBit(false);
      }

      // padding
      while (true) {

        if (buffer.getLengthInBits() >= totalDataCount * 8) {
          break;
        }
        buffer.put(PAD0, 8);

        if (buffer.getLengthInBits() >= totalDataCount * 8) {
          break;
        }
        buffer.put(PAD1, 8);
      }

      return createBytes(buffer, rsBlocks);
    };

    _this.addData = function(data, mode) {

      mode = mode || 'Byte';

      var newData = null;

      switch(mode) {
      case 'Numeric' :
        newData = qrNumber(data);
        break;
      case 'Alphanumeric' :
        newData = qrAlphaNum(data);
        break;
      case 'Byte' :
        newData = qr8BitByte(data);
        break;
      case 'Kanji' :
        newData = qrKanji(data);
        break;
      default :
        throw 'mode:' + mode;
      }

      _dataList.push(newData);
      _dataCache = null;
    };

    _this.isDark = function(row, col) {
      if (row < 0 || _moduleCount <= row || col < 0 || _moduleCount <= col) {
        throw row + ',' + col;
      }
      return _modules[row][col];
    };

    _this.getModuleCount = function() {
      return _moduleCount;
    };

    _this.make = function() {
      if (_typeNumber < 1) {
        var typeNumber = 1;

        for (; typeNumber < 40; typeNumber++) {
          var rsBlocks = QRRSBlock.getRSBlocks(typeNumber, _errorCorrectionLevel);
          var buffer = qrBitBuffer();

          for (var i = 0; i < _dataList.length; i++) {
            var data = _dataList[i];
            buffer.put(data.getMode(), 4);
            buffer.put(data.getLength(), QRUtil.getLengthInBits(data.getMode(), typeNumber) );
            data.write(buffer);
          }

          var totalDataCount = 0;
          for (var i = 0; i < rsBlocks.length; i++) {
            totalDataCount += rsBlocks[i].dataCount;
          }

          if (buffer.getLengthInBits() <= totalDataCount * 8) {
            break;
          }
        }

        _typeNumber = typeNumber;
      }

      makeImpl(false, getBestMaskPattern() );
    };

    _this.createTableTag = function(cellSize, margin) {

      cellSize = cellSize || 2;
      margin = (typeof margin == 'undefined')? cellSize * 4 : margin;

      var qrHtml = '';

      qrHtml += '<table style="';
      qrHtml += ' border-width: 0px; border-style: none;';
      qrHtml += ' border-collapse: collapse;';
      qrHtml += ' padding: 0px; margin: ' + margin + 'px;';
      qrHtml += '">';
      qrHtml += '<tbody>';

      for (var r = 0; r < _this.getModuleCount(); r += 1) {

        qrHtml += '<tr>';

        for (var c = 0; c < _this.getModuleCount(); c += 1) {
          qrHtml += '<td style="';
          qrHtml += ' border-width: 0px; border-style: none;';
          qrHtml += ' border-collapse: collapse;';
          qrHtml += ' padding: 0px; margin: 0px;';
          qrHtml += ' width: ' + cellSize + 'px;';
          qrHtml += ' height: ' + cellSize + 'px;';
          qrHtml += ' background-color: ';
          qrHtml += _this.isDark(r, c)? '#000000' : '#ffffff';
          qrHtml += ';';
          qrHtml += '"/>';
        }

        qrHtml += '</tr>';
      }

      qrHtml += '</tbody>';
      qrHtml += '</table>';

      return qrHtml;
    };

    _this.createSvgTag = function(cellSize, margin, alt, title) {

      var opts = {};
      if (typeof arguments[0] == 'object') {
        // Called by options.
        opts = arguments[0];
        // overwrite cellSize and margin.
        cellSize = opts.cellSize;
        margin = opts.margin;
        alt = opts.alt;
        title = opts.title;
      }

      cellSize = cellSize || 2;
      margin = (typeof margin == 'undefined')? cellSize * 4 : margin;

      // Compose alt property surrogate
      alt = (typeof alt === 'string') ? {text: alt} : alt || {};
      alt.text = alt.text || null;
      alt.id = (alt.text) ? alt.id || 'qrcode-description' : null;

      // Compose title property surrogate
      title = (typeof title === 'string') ? {text: title} : title || {};
      title.text = title.text || null;
      title.id = (title.text) ? title.id || 'qrcode-title' : null;

      var size = _this.getModuleCount() * cellSize + margin * 2;
      var c, mc, r, mr, qrSvg='', rect;

      rect = 'l' + cellSize + ',0 0,' + cellSize +
        ' -' + cellSize + ',0 0,-' + cellSize + 'z ';

      qrSvg += '<svg version="1.1" xmlns="http://www.w3.org/2000/svg"';
      qrSvg += !opts.scalable ? ' width="' + size + 'px" height="' + size + 'px"' : '';
      qrSvg += ' viewBox="0 0 ' + size + ' ' + size + '" ';
      qrSvg += ' preserveAspectRatio="xMinYMin meet"';
      qrSvg += (title.text || alt.text) ? ' role="img" aria-labelledby="' +
          escapeXml([title.id, alt.id].join(' ').trim() ) + '"' : '';
      qrSvg += '>';
      qrSvg += (title.text) ? '<title id="' + escapeXml(title.id) + '">' +
          escapeXml(title.text) + '</title>' : '';
      qrSvg += (alt.text) ? '<description id="' + escapeXml(alt.id) + '">' +
          escapeXml(alt.text) + '</description>' : '';
      qrSvg += '<rect width="100%" height="100%" fill="white" cx="0" cy="0"/>';
      qrSvg += '<path d="';

      for (r = 0; r < _this.getModuleCount(); r += 1) {
        mr = r * cellSize + margin;
        for (c = 0; c < _this.getModuleCount(); c += 1) {
          if (_this.isDark(r, c) ) {
            mc = c*cellSize+margin;
            qrSvg += 'M' + mc + ',' + mr + rect;
          }
        }
      }

      qrSvg += '" stroke="transparent" fill="black"/>';
      qrSvg += '</svg>';

      return qrSvg;
    };

    _this.createDataURL = function(cellSize, margin) {

      cellSize = cellSize || 2;
      margin = (typeof margin == 'undefined')? cellSize * 4 : margin;

      var size = _this.getModuleCount() * cellSize + margin * 2;
      var min = margin;
      var max = size - margin;

      return createDataURL(size, size, function(x, y) {
        if (min <= x && x < max && min <= y && y < max) {
          var c = Math.floor( (x - min) / cellSize);
          var r = Math.floor( (y - min) / cellSize);
          return _this.isDark(r, c)? 0 : 1;
        } else {
          return 1;
        }
      } );
    };

    _this.createImgTag = function(cellSize, margin, alt) {

      cellSize = cellSize || 2;
      margin = (typeof margin == 'undefined')? cellSize * 4 : margin;

      var size = _this.getModuleCount() * cellSize + margin * 2;

      var img = '';
      img += '<img';
      img += '\u0020src="';
      img += _this.createDataURL(cellSize, margin);
      img += '"';
      img += '\u0020width="';
      img += size;
      img += '"';
      img += '\u0020height="';
      img += size;
      img += '"';
      if (alt) {
        img += '\u0020alt="';
        img += escapeXml(alt);
        img += '"';
      }
      img += '/>';

      return img;
    };

    var escapeXml = function(s) {
      var escaped = '';
      for (var i = 0; i < s.length; i += 1) {
        var c = s.charAt(i);
        switch(c) {
        case '<': escaped += '&lt;'; break;
        case '>': escaped += '&gt;'; break;
        case '&': escaped += '&amp;'; break;
        case '"': escaped += '&quot;'; break;
        default : escaped += c; break;
        }
      }
      return escaped;
    };

    var _createHalfASCII = function(margin) {
      var cellSize = 1;
      margin = (typeof margin == 'undefined')? cellSize * 2 : margin;

      var size = _this.getModuleCount() * cellSize + margin * 2;
      var min = margin;
      var max = size - margin;

      var y, x, r1, r2, p;

      var blocks = {
        '██': '█',
        '█ ': '▀',
        ' █': '▄',
        '  ': ' '
      };

      var blocksLastLineNoMargin = {
        '██': '▀',
        '█ ': '▀',
        ' █': ' ',
        '  ': ' '
      };

      var ascii = '';
      for (y = 0; y < size; y += 2) {
        r1 = Math.floor((y - min) / cellSize);
        r2 = Math.floor((y + 1 - min) / cellSize);
        for (x = 0; x < size; x += 1) {
          p = '█';

          if (min <= x && x < max && min <= y && y < max && _this.isDark(r1, Math.floor((x - min) / cellSize))) {
            p = ' ';
          }

          if (min <= x && x < max && min <= y+1 && y+1 < max && _this.isDark(r2, Math.floor((x - min) / cellSize))) {
            p += ' ';
          }
          else {
            p += '█';
          }

          // Output 2 characters per pixel, to create full square. 1 character per pixels gives only half width of square.
          ascii += (margin < 1 && y+1 >= max) ? blocksLastLineNoMargin[p] : blocks[p];
        }

        ascii += '\n';
      }

      if (size % 2 && margin > 0) {
        return ascii.substring(0, ascii.length - size - 1) + Array(size+1).join('▀');
      }

      return ascii.substring(0, ascii.length-1);
    };

    _this.createASCII = function(cellSize, margin) {
      cellSize = cellSize || 1;

      if (cellSize < 2) {
        return _createHalfASCII(margin);
      }

      cellSize -= 1;
      margin = (typeof margin == 'undefined')? cellSize * 2 : margin;

      var size = _this.getModuleCount() * cellSize + margin * 2;
      var min = margin;
      var max = size - margin;

      var y, x, r, p;

      var white = Array(cellSize+1).join('██');
      var black = Array(cellSize+1).join('  ');

      var ascii = '';
      var line = '';
      for (y = 0; y < size; y += 1) {
        r = Math.floor( (y - min) / cellSize);
        line = '';
        for (x = 0; x < size; x += 1) {
          p = 1;

          if (min <= x && x < max && min <= y && y < max && _this.isDark(r, Math.floor((x - min) / cellSize))) {
            p = 0;
          }

          // Output 2 characters per pixel, to create full square. 1 character per pixels gives only half width of square.
          line += p ? white : black;
        }

        for (r = 0; r < cellSize; r += 1) {
          ascii += line + '\n';
        }
      }

      return ascii.substring(0, ascii.length-1);
    };

    _this.renderTo2dContext = function(context, cellSize) {
      cellSize = cellSize || 2;
      var length = _this.getModuleCount();
      for (var row = 0; row < length; row++) {
        for (var col = 0; col < length; col++) {
          context.fillStyle = _this.isDark(row, col) ? 'black' : 'white';

const getLocalSettings = () => {

const getCustom = (key,def) => {
  try{

// 修改設定：用「交易」讀取雲端最新的值再套用這次的變更，
// 不同裝置同時修改不同（甚至相同）項目也不會互相蓋掉
const parseSetting = raw => { try{ return raw==null?null:JSON.parse(raw); }catch(e){ return null; } };
const addUniq = (v,same=(a,b)=>a===b) => c => { c=Array.isArray(c)?c:[]; return c.some(x=>same(x,v))?c:[...c,v]; };
const removeWhere = pred => c => (Array.isArray(c)?c:[]).filter(x=>!pred(x));
const setCustom = (key, upd) => {
  const apply = cur => typeof upd==="function" ? upd(cur) : upd;
  const seedBase = getLocalSettings();              // 雲端還沒有設定時才會用到
  const optimistic = apply(getCustom(key,null));    // 先讓畫面立即反應
  const optStr = JSON.stringify(optimistic);
  localStorage.setItem("setting_"+key,optStr);
  if(CLOUD_EXISTS) CLOUD={...CLOUD,[key]:optStr};
  runTransaction(db, async tx => {
    const ref=SETTINGS_DOC();
    const snap=await tx.get(ref);
    if(snap.exists()){
      tx.set(ref,{[key]:JSON.stringify(apply(parseSetting(snap.data()[key])))},{merge:true});
    } else {
      tx.set(ref,{...seedBase,[key]:JSON.stringify(apply(parseSetting(seedBase[key])))});
    }
  }).catch(err=>{CLOUD_ERR=err.code||err.message;alert("⚠️ 設定沒有存到雲端，其他裝置不會更新！\n原因："+(err.code||err.message)+(String(err.code).includes("permission")?"\n\n需要到 Firebase 的 Firestore 規則開放 config 集合。":""));});
};
// 第一次上傳：雲端已經有的項目以雲端為準，只補上雲端沒有的，不會蓋掉任何東西
const uploadLocalSettings = async () => {
  const local=getLocalSettings();
  if(!Object.keys(local).length){alert("這台裝置沒有任何自訂設定可以上傳");return false;}
  await runTransaction(db, async tx => {
    const ref=SETTINGS_DOC();const snap=await tx.get(ref);
    const cloud=snap.exists()?snap.data():{};
    const add={};Object.keys(local).forEach(k=>{ if(!(k in cloud)) add[k]=local[k]; });
    tx.set(ref,add,{merge:true});
  });
  return true;
};

// 報表排序：品項先管帶、後包布，各自依系統裡的分類與品項順序；單位依送洗頁的單位順序
const _natural=(a,b)=>String(a).localeCompare(String(b),"zh-Hant",{numeric:true});
const sortItemsBySystem = list => {
  const idx={};let n=0;getEffectiveCats().forEach(c=>c.items.forEach(i=>{if(!(i in idx))idx[i]=n++;}));
  const grp=l=>isClothItem(l)?1:0;   // 0 = 管帶，1 = 包布
  return list.sort((a,b)=>grp(a)-grp(b)||((a in idx?idx[a]:1e9)-(b in idx?idx[b]:1e9))||_natural(a,b));

const sortUnitsBySystem = (list, campus, routeId) => {
  const idx={};let n=0;
  // 新店院區固定順序：6E～13E → 門診區（全部門診子單位）→ 急診 → 4A、9A、DR、NBC、CCU、MICU-1、MICU-2、BR、SICU、HR、護理之家、手術室、牙科 → 其他單位
  const last={};
  if(campus==="xindian"){
    const put=s=>{if(!(s in idx))idx[s]=n++;};
    ["6E","7E","8E","10E","11E","12E","13E"].forEach(put);
    effSubs(OPD_UNIT).forEach(put);
    ["急診","ER"].forEach(put);
    ["4A","9A","DR","NBC","CCU","MICU-1","MICU-2","BR","SICU","HR","護理之家","手術室","牙科"].forEach(put);
  }
  // 先依「本院區」的單位順序，再接其他（避免兩院區同名單位，例如「門診」，互相干擾）
  const own=campus==="ankang"?[...ANKANG_UNITS,...getCustom("extra_units_ankang",[])]:[WARD_UNIT,OPD_UNIT,...OTHER_UNITS.map(effUnit),...getCustom("extra_units",[])];
  [...own,...getAllUnits()].forEach(u=>{effSubs(u).forEach(s=>{if(!(s in idx))idx[s]=n++;});});
  const defPos=u=>last[u]?2e9:(u in idx?idx[u]:1e9);
  // 總設定「報表排序」自訂的順序優先；沒排到的單位接在後面，依預設順序
  const custom=getCustom("report_order_"+campus,[]);
  const ci={}; (Array.isArray(custom)?custom:[]).forEach((s,i)=>{if(!(s in ci))ci[s]=i;});
  const pos=u=>(u in ci)?ci[u]:3e9+defPos(u);
  // 單位排序清單上的單位照清單順序，不在清單上的接在後面
  const ru=getUnitOrder(campus), ri={};
  (ru||[]).forEach((s,i)=>{if(!(s in ri))ri[s]=i;});
  const pos2=u=>(u in ri)?ri[u]:1e10+pos(u);
  return list.sort((a,b)=>(pos2(a)-pos2(b))||_natural(a,b));
};

// 申請日期（YYYY-MM-DD）：相容各種時間格式，沒有時間就用送出時的時間戳
const orderDate = o => {
  const m=String(o.time||"").match(/(\d{4})[\/\-.](\d{1,2})[\/\-.](\d{1,2})/);
  if(m) return m[1]+"-"+m[2].padStart(2,"0")+"-"+m[3].padStart(2,"0");
  if(o.ts){const d=new Date(o.ts);if(!isNaN(d))return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");}
  return "";
};

// 報表用的日期＝需求日期；舊單沒有需求日期時，改用申請日期
const needDateOf = o => {
  const m=String(o.needDate||"").match(/(\d{4})[\/\-.](\d{1,2})[\/\-.](\d{1,2})/);
  let nd = m ? m[1]+"-"+m[2].padStart(2,"0")+"-"+m[3].padStart(2,"0") : orderDate(o);
  // 舊單（沒有記錄是否手動選日期）：需求日＝申請日、且 16:00 以後送出 → 視為隔天
  if(o.needDateManual===undefined && nd && nd===orderDate(o)){
    const t=String(o.time||""), hm=t.match(/(\d{1,2}):(\d{2})/);
    let hr=hm?parseInt(hm[1],10):-1; if(/下午|PM|pm/.test(t)&&hr<12) hr+=12;
    if(hr>=NEXT_DAY_HOUR){ const d=new Date(nd+"T00:00:00"); d.setDate(d.getDate()+1); nd=ymd(d); }
  }
  return nd;
};

// 合併「進行中」與「已封存」並去除重複（舊版多台裝置同時封存可能產生重複）
const mergeOrders = (active, archived) => {
  const seen=new Set(), out=[];
  const key=o=>(o.ts||"")+"|"+(o.unitId||"")+"|"+(o.sub||"");
  [...active,...archived].forEach(o=>{const k=key(o);if(seen.has(o._id)||seen.has(k))return;seen.add(o._id);seen.add(k);out.push(o);});
  return out;
};

// 報表／查單用：從資料庫讀取全部申請單；fromCache＝沒有連到伺服器（只讀到本機暫存，資料可能不完整）
// ⚠️ 省流量：封存區（orders_archive）會越來越大，絕對不要整個讀；一律用條件只讀需要的那幾天
//    （Firebase 免費方案每天只能讀 5 萬筆，超過會出現 resource-exhausted）
const _dayMs=86400000, _msOf=ds=>new Date(ds+"T00:00:00").getTime();
const _snapList=(snaps,active)=>{const seen=new Set(),out=[];snaps.forEach(sn=>sn.docs.forEach(d=>{if(seen.has(d.id))return;seen.add(d.id);out.push({_id:d.id,...(active?{_active:true}:{}),...d.data()});}));return out;};
const _cached=sn=>!!(sn.metadata&&sn.metadata.fromCache);
// 讀取「進行中」全部 ＋ 封存區裡需求日期或送出時間落在 [from-pad, to+pad] 的單
const loadOrdersRange = async (from,to,pad=8) => {
  const arc=collection(db,"orders_archive");
  const act=collection(db,"orders");
  const byNeed=c=>query(c,where("needDate",">=",addDays(from,-pad)),where("needDate","<=",addDays(to,pad)));
  const byTs=c=>query(c,where("ts",">=",_msOf(from)-pad*_dayMs),where("ts","<",_msOf(to)+(pad+1)*_dayMs));
  const [s1,s2,a1,a2]=await Promise.all([getDocs(byNeed(act)),getDocs(byTs(act)),getDocs(byNeed(arc)),getDocs(byTs(arc))]);
  return {fromCache:[s1,s2,a1,a2].some(_cached), list:mergeOrders(_snapList([s1,s2],true),_snapList([a1,a2]))};
};
// 某單位的歷史：封存區只讀這個單位的單
const loadOrdersOfSub = async (sub) => {
  const [s1,a1]=await Promise.all([getDocs(query(collection(db,"orders"),where("sub","==",sub))),getDocs(query(collection(db,"orders_archive"),where("sub","==",sub)))]);
  return {fromCache:_cached(s1)||_cached(a1), list:mergeOrders(_snapList([s1],true),_snapList([a1]))};
};
const addDays=(ds,n)=>{const d=new Date(ds+"T00:00:00");d.setDate(d.getDate()+n);return ymd(d);};
const mdOf=ds=>ds?ds.slice(5).replace("-","/"):"?";
// 這張單為什麼「沒有」算進 [from,to] 的報表（有算進去回傳 ""）
const reportExcludeReason=(o,campus,from,to)=>{
  const nd=needDateOf(o), od=orderDate(o);
  if(campusOf(o)!==campus) return "送到「"+campusName(campusOf(o))+"」，不是本院區";
  if(o.cancelled) return "單位已取消這張單";
  if(!nd) return "沒有日期";
  if(nd<from) return "需求日期是 "+mdOf(nd)+"，在選的日期之前";
  if(nd>to) return "需求日期是 "+mdOf(nd)+"，在選的日期之後"+(od&&od<=to&&od>=from&&!o.needDateManual?"（16:00 後送出，自動算隔天）":o.needDateManual?"（單位自己選的需求日期）":"");
  return "";
};
// 跟這次報表「有關、但沒算進去」的單：送單日在範圍內、需求日在範圍內但被排除、或還沒收件而需求日在範圍前 7 天內
const nearMissOrders=(list,campus,from,to)=>list.filter(o=>{
  const r=reportExcludeReason(o,campus,from,to); if(!r) return false;
  const nd=needDateOf(o), od=orderDate(o);
  if(campusOf(o)!==campus) return nd>=from&&nd<=to&&!o.cancelled;
  if(o.cancelled) return (nd>=from&&nd<=to)||(od>=from&&od<=to);
  if(od>=from&&od<=to) return true;
  return !o.received&&nd<from&&nd>=addDays(from,-7);
});

// Archive & delete
const archiveAndDelete = async (list) => {
  for (const o of list) {
    const {_id,...data} = o;
    await setDoc(doc(db,"orders_archive",_id),{...data, archivedAt:Date.now()});

// 可以清除的單：已收件，或已取消且供應室已確認（未收件、未確認的單一律保留）
const isClearable = o => !!o.received || (!!o.cancelled && !o.pendingAck);
// 單子「結束」的日期：收件日，或取消日
const doneDateOf = o => {
  if(o.received) return (o.receivedAt||"").slice(0,10).replace(/\//g,"-");
  const c=(o.editLog||[]).filter(l=>l.type==="cancel").pop();
  return c ? (c.time||"").slice(0,10).replace(/\//g,"-") : "";
};
const cleanFinished = async (beforeToday) => {
  const snap=await getDocs(collection(db,"orders"));
  const list=snap.docs.map(d=>({_id:d.id,...d.data()})).filter(isClearable)
    .filter(o=>!beforeToday || (doneDateOf(o) && doneDateOf(o)<today()));
  if(list.length) await archiveAndDelete(list);
};
// 每天 23:59 清除已收件／已取消的單
const scheduleDailyClean = () => {
  const n=new Date(), next=new Date(n);
  next.setHours(23,59,0,0);
  if(next<=n) next.setDate(next.getDate()+1);
  setTimeout(async()=>{
    try{ await cleanFinished(false); }catch(err){ console.error("自動清除失敗",err); }
    scheduleDailyClean();
  }, next-n);
};
// 自動清除已停用：只有供應室按「🗑️ 清除」時才會清除（已收件／已取消且確認的單）
const AUTO_CLEAN = false;
if(AUTO_CLEAN && !VENDOR_MODE){
  scheduleDailyClean();
  setTimeout(()=>cleanFinished(true).catch(err=>console.error("補清除失敗",err)),3000);
}

function e(tag, props, ...kids) {
  const el = document.createElement(tag);
  for (const [k,v] of Object.entries(props||{})) {
    if(k==="style") el.style.cssText=v;
    else if(k==="class") el.className=v;
    else if(k.startsWith("on")) el.addEventListener(k.slice(2),v);
    else if(k==="disabled"&&v) el.disabled=true;
    else if(k==="value") el.value=v;
    else if(k==="placeholder") el.placeholder=v;
    else if(k==="type") el.type=v;
    else if(k==="rows") el.rows=v;
    else if(k==="min") el.min=v;
    else el.setAttribute(k,v);
  }
  for (const k of kids.flat(Infinity)) {
    if(k==null||k===false) continue;
    el.append(typeof k==="string"?document.createTextNode(k):k);
  }
  return el;
}

// 別台裝置更新資料時用 safeRender：這台如果正在輸入，等輸入完再更新畫面
let _renderPending=false;
const isTyping=()=>{const a=document.activeElement;const app=document.getElementById("app");return !!(a&&app&&app.contains(a)&&(a.tagName==="INPUT"||a.tagName==="TEXTAREA"||a.tagName==="SELECT"));};
function safeRender(){ if(isTyping()){_renderPending=true;return;} _renderPending=false; render(); }
document.addEventListener("focusout",()=>setTimeout(()=>{ if(_renderPending&&!isTyping()){_renderPending=false;render();} },150));
// ── 自動更新：網站上傳新版後，開著的頁面會自動偵測並重新整理 ──
const fetchLatestVersion=async()=>{
  try{const r=await fetch(location.pathname+"?_v="+Date.now(),{cache:"no-store"});if(!r.ok)return null;
      const m=(await r.text()).match(/APP_VERSION = "([^"]+)"/);return m?m[1]:null;}catch(e){return null;}
};
const saveAndReload=v=>{
  // 同一個新版本 10 分鐘內只自動重新整理一次，避免網路快取造成反覆重整
  try{const t=JSON.parse(sessionStorage.getItem("__updTry")||"null");if(t&&t.v===v&&Date.now()-t.at<600000)return;
      sessionStorage.setItem("__updTry",JSON.stringify({v,at:Date.now()}));}catch(e){}
  try{sessionStorage.setItem("__resume",JSON.stringify({at:Date.now(),y:window.scrollY,
      S:{view:S.view,unitId:S.unitId,campus:S.campus,histSub:S.histSub,histUnitId:S.histUnitId,vendorCampus:S.vendorCampus,cssdUI:S.cssdUI,setUI:S.setUI},F}));}catch(e){}
  location.reload();
};
let _pendingVer=null;
const checkUpdate=async()=>{
  if(location.protocol==="file:")return false;
  const v=await fetchLatestVersion();
  if(!v||v===APP_VERSION)return false;
  // 正在打字、或廠商正在填登記表時先等，打完字（離開輸入框）就自動更新
  const vendorFilling=S.view==="vendor"&&[...document.querySelectorAll("#app input,#app textarea")].some(i=>i.type!=="date"&&i.value&&i.value!==i.defaultValue);
  if(isTyping()||vendorFilling){_pendingVer=v;return true;}
  saveAndReload(v);return true;
};
document.addEventListener("focusout",()=>setTimeout(()=>{if(_pendingVer&&!isTyping()){ if(IS_FILE) saveAndReload(_pendingVer); else checkUpdate(); }},400));
window.addEventListener("focus",()=>checkUpdate());
// 透過資料庫通知新版：任何裝置開到新版，就把版本序號寫進 config/app；開著舊版的裝置收到後自動重新整理
// （直接開檔案時也有效：重新整理就會讀到共用資料夾裡已換好的新檔案）
{
  onSnapshot(doc(db,"config","app"), snap=>{
    const remote=snap.exists()?Number(snap.data().build||0):0;
    if(remote<APP_BUILD){ setDoc(doc(db,"config","app"),{build:APP_BUILD,version:APP_VERSION,at:Date.now()},{merge:true}).catch(()=>{}); }
    else if(remote>APP_BUILD){
      const v=String(snap.data().version||remote);
      const vendorFilling=S.view==="vendor"&&[...document.querySelectorAll("#app input,#app textarea")].some(i=>i.type!=="date"&&i.value&&i.value!==i.defaultValue);
      if(isTyping()||vendorFilling){_pendingVer=v;} else saveAndReload(v);
    }
  }, ()=>{});
}
setTimeout(checkUpdate,10000);
setInterval(checkUpdate,60*1000);   // 每分鐘檢查一次
document.addEventListener("visibilitychange",()=>{if(!document.hidden)checkUpdate();});

let _lastView=null;
function render() {
  if(VENDOR_MODE) S.view="vendor";
  if(["form","settings"].includes(S.view)) ensurePhotos();
  if(_resumed&&!S.loading){_resumed=false;const y=window.__resumeY||0;setTimeout(()=>{window.scrollTo(0,y);
    const t=document.createElement("div");t.textContent="✅ 系統已自動更新到最新版本";
    t.style.cssText="position:fixed;left:50%;top:14px;transform:translateX(-50%);background:#065f46;color:#fff;font-size:20px;font-weight:800;padding:10px 20px;border-radius:12px;z-index:2147483646;box-shadow:0 6px 20px rgba(0,0,0,.25)";
    document.body.append(t);setTimeout(()=>t.remove(),3500);},300);}
  const _keepY = (_lastView===S.view) ? window.scrollY : 0;
  _lastView = S.view;
  requestAnimationFrame(()=>{ if(_keepY) window.scrollTo(0,_keepY); });
  if(S.loading&&S.view!=="netcheck"){
    const app=document.getElementById("app");app.innerHTML="";
    const waited=Date.now()-(window.__T0||Date.now());

      e("div",{style:"font-size:22px;color:#6b7280;"},"⏳ 載入中…"));
    if(window.__netErr||waited>10000){
      box.append(e("div",{style:"background:#fef2f2;border:3px solid #dc2626;border-radius:14px;padding:16px 18px;max-width:560px;color:#991b1b;font-size:20px;line-height:1.6;"},
        e("div",{style:"font-weight:900;font-size:22px;margin-bottom:4px;"},"⚠️ 連不上資料庫"),
        "這台電腦的網路可能被院內防火牆擋住了。請按下方按鈕檢查，並把結果截圖給資訊室。"),

    } else setTimeout(()=>{if(S.loading)render();},10500-waited);
    app.append(box);return;

  const app=document.getElementById("app");
  app.innerHTML="";
  if(S.view==="home") app.append(renderHome());
  else if(S.view==="home_inner") app.append(renderHomeInner());
  else if(S.view==="form") app.append(renderForm());

  else if(S.view==="netcheck") app.append(renderNetCheck());

}

          if(deletedDefault.map(renamedItem).includes(v)){const o=deletedDefault.find(x=>renamedItem(x)===v);setCustom("deleted_"+c.id,removeWhere(i=>i===o));alert("「"+v+"」原本是預設品項，已幫你還原");rerender();return;}
          if(deletedDefault.includes(v)){setCustom("deleted_"+c.id,removeWhere(i=>i===v));alert("「"+v+"」原本是預設品項，已幫你還原");rerender();return;}

          setCustom("items_"+c.id,addUniq(v));rerender();
        }},"＋"));
        block.append(ar);body.append(block);
      });
    }
    root.append(body);return root;
  }
  function rerender(){S.setUI={setCampus,tab};const y=window.scrollY;const app=document.getElementById("app");app.innerHTML="";app.append(build());window.scrollTo(0,y);}
  SETTINGS_REFRESH=()=>{if(S.view==="settings")rerender();};
  return build();
}

/* ─── VENDOR FORM ─── */
function renderVendor() {
  let VF={date:today(),time:"",vendorName:"",contact:"",phone:"",itemType:"",useDate:"",done:false};
  function build(){
    const root=e("div",{style:"min-height:100vh;background:#fff7ed;"});

    // Header
    root.append(e("div",{style:"background:linear-gradient(135deg,#b45309,#d97706);color:#fff;padding:24px 20px;text-align:center;box-shadow:0 4px 12px rgba(180,83,9,.3);position:relative;"},

      e("div",{style:"font-size:44px;margin-bottom:6px;"},"🏭"),
      e("div",{style:"font-size:28px;font-weight:900;"},"院外廠商送洗登記"),
      e("div",{style:"font-size:20px;color:#fde68a;margin-top:4px;"},"天主教耕莘醫療財團法人耕莘醫院 "+campusName(S.vendorCampus)+" 供應室")
    ));

    // 管理入口（右上小按鈕）
    const mgBtn=e("button",{style:"position:fixed;top:14px;right:14px;background:rgba(255,255,255,.25);color:#fff;border:none;border-radius:8px;padding:8px 12px;font-size:20px;font-weight:700;z-index:20;",onclick:()=>{const pw=prompt("請輸入供應室密碼：");if(pw==="2600"){S.view="vendor_cssd";render();}else if(pw!==null)alert("密碼錯誤！");}},
      "📋 管理"
    );
    if(!VENDOR_MODE) root.append(mgBtn);

    if(VF.done){
      root.append(e("div",{style:"display:flex;flex-direction:column;align-items:center;justify-content:center;padding:60px 20px;text-align:center;"},
        e("div",{style:"font-size:80px;margin-bottom:16px;"},"✅"),
        e("div",{style:"font-size:28px;font-weight:900;color:#065f46;margin-bottom:8px;"},"送洗申請已送出！"),
        e("div",{style:"font-size:22px;color:#6b7280;margin-bottom:24px;"},"供應室已收到通知，謝謝！"),
        e("button",{style:"padding:16px 40px;background:#b45309;color:#fff;border:none;border-radius:14px;font-size:24px;font-weight:800;",onclick:()=>{VF={date:today(),time:"",vendorName:"",contact:"",phone:"",itemType:"",useDate:"",done:false};rerender();}},"再次登記"),
        e("button",{style:"margin-top:10px;padding:12px 40px;background:#fff;color:#b45309;border:2px solid #b45309;border-radius:14px;font-size:22px;font-weight:700;",onclick:()=>{S.view="home";render();}},"返回首頁")
      ));
      return root;
    }

    const body=e("div",{style:"padding:20px 16px 60px;"});

    // Card wrapper
    const card=e("div",{style:"background:#fff;border-radius:20px;padding:24px;box-shadow:0 4px 20px rgba(180,83,9,.1);border:2px solid #fed7aa;"});

    const field=(icon,label,req,content)=>{
      const wrap=e("div",{style:"margin-bottom:20px;"});
      wrap.append(e("div",{style:"display:flex;align-items:center;gap:8px;margin-bottom:8px;"},
        e("span",{style:"font-size:22px;"},icon),
        e("span",{style:"font-size:22px;font-weight:800;color:#1e293b;"},label),
        req?e("span",{style:"color:#ef4444;font-size:18px;"},"*"):null
      ));
      wrap.append(content);
      return wrap;
    };

    const inp=(ph,val,key,type="text")=>{
      const el=e("input",{type,style:"width:100%;padding:14px 16px;border:2px solid #e5e7eb;border-radius:12px;font-size:22px;font-family:inherit;background:#f9fafb;",placeholder:ph,value:val});
      el.addEventListener("input",ev=>{VF[key]=ev.target.value;});
      el.addEventListener("change",ev=>{VF[key]=ev.target.value;});
      return el;
    };

    // 日期時間一排
    const dateTimeRow=e("div",{style:"display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:20px;"});
    dateTimeRow.append(
      e("div",{},
        e("div",{style:"display:flex;align-items:center;gap:6px;margin-bottom:8px;"},e("span",{},"📅"),e("span",{style:"font-size:22px;font-weight:800;"},"寄銷日期"),e("span",{style:"color:#ef4444;font-size:18px;"},"*")),
        inp("",VF.date,"date","date")
      ),
      e("div",{},
        e("div",{style:"display:flex;align-items:center;gap:6px;margin-bottom:8px;"},e("span",{},"🕐"),e("span",{style:"font-size:22px;font-weight:800;"},"時間"),e("span",{style:"color:#ef4444;font-size:18px;"},"*")),
        inp("14:30",VF.time,"time")
      )
    );
    card.append(dateTimeRow);

    card.append(field("🏭","廠商名稱",true,inp("請輸入廠商名稱",VF.vendorName,"vendorName")));
    
    // 聯絡人電話一排
    const contactRow=e("div",{style:"display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:20px;"});
    contactRow.append(
      e("div",{},
        e("div",{style:"display:flex;align-items:center;gap:6px;margin-bottom:8px;"},e("span",{},"👤"),e("span",{style:"font-size:22px;font-weight:800;"},"聯絡人"),e("span",{style:"color:#ef4444;font-size:18px;"},"*")),
        inp("聯絡人姓名",VF.contact,"contact")
      ),
      e("div",{},
        e("div",{style:"display:flex;align-items:center;gap:6px;margin-bottom:8px;"},e("span",{},"📞"),e("span",{style:"font-size:22px;font-weight:800;"},"電話"),e("span",{style:"color:#ef4444;font-size:18px;"},"*")),
        inp("聯絡電話",VF.phone,"phone")
      )
    );
    card.append(contactRow);

    card.append(field("🔧","器械種類",true,inp("請輸入器械種類名稱",VF.itemType,"itemType")));
    card.append(field("📆","器械預計使用日期",true,inp("",VF.useDate,"useDate","date")));

    body.append(card);

    const canSubmit=VF.vendorName&&VF.contact&&VF.phone&&VF.itemType&&VF.useDate;
    const btn=e("button",{
      style:"width:100%;margin-top:16px;padding:18px;background:"+(canSubmit?"linear-gradient(135deg,#b45309,#d97706)":"#9ca3af")+";color:#fff;border:none;border-radius:14px;font-size:26px;font-weight:900;",
      onclick:async()=>{
        if(!(VF.date&&VF.vendorName.trim()&&VF.contact.trim()&&VF.phone.trim()&&VF.itemType.trim()&&VF.useDate)){alert("請填寫所有必填欄位（*）");return;}
        try{
          await addDoc(collection(db,"vendor_orders"),{date:VF.date,time:VF.time,vendorName:VF.vendorName,contact:VF.contact,phone:VF.phone,itemType:VF.itemType,useDate:VF.useDate,status:"待處理",campus:S.vendorCampus,campusLabel:campusName(S.vendorCampus),ts:Date.now(),time2:now()});
          VF.done=true;rerender();
        }catch(err){alert("送出失敗："+err.message);}
      }
    },"送出送洗申請 →");
    body.append(btn);
    const hint=e("p",{style:"text-align:center;color:#9ca3af;font-size:20px;margin-top:8px;"},"請填寫所有 * 必填欄位");
    body.append(hint);
    // 填寫時即時更新按鈕顏色與提示
    const refreshBtn=()=>{const ok=!!(VF.date&&VF.vendorName.trim()&&VF.contact.trim()&&VF.phone.trim()&&VF.itemType.trim()&&VF.useDate);
      btn.style.background=ok?"linear-gradient(135deg,#b45309,#d97706)":"#9ca3af";hint.style.display=ok?"none":"";};
    body.addEventListener("input",()=>setTimeout(refreshBtn,0));body.addEventListener("change",()=>setTimeout(refreshBtn,0));
    refreshBtn();

    root.append(body);
    return root;
  }
  function rerender(){const app=document.getElementById("app");app.innerHTML="";app.append(build());}
  return build();
}

/* ─── VENDOR CSSD ─── */
function renderVendorCssd() {
  const root=e("div",{style:"min-height:100vh;background:#f1f5f9;"});
  root.append(e("div",{style:"background:#b45309;color:#fff;padding:14px 16px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:10;"},
    e("button",{style:"background:rgba(255,255,255,.2);color:#fff;border:none;border-radius:8px;padding:8px 14px;font-size:26px;font-weight:700;",onclick:()=>{S.view="home";render();}},"← 返回"),

      card.append(e("div",{style:"display:flex;justify-content:space-between;margin-bottom:8px;"},e("span",{style:"background:"+(o.status==="已完成"?"#10b981":"#b45309")+";color:#fff;font-size:22px;font-weight:700;padding:4px 12px;border-radius:10px;"},o.status||"待處理"),e("span",{style:"font-size:20px;color:#9ca3af;"},o.time2||"")));
      card.append(e("div",{style:"font-size:24px;font-weight:800;color:#1e293b;margin-bottom:4px;"},"🏭 "+o.vendorName));
      card.append(e("div",{style:"font-size:22px;color:#374151;margin-bottom:4px;"},"👤 "+o.contact+"　📞 "+o.phone));
      card.append(e("div",{style:"font-size:22px;color:#374151;margin-bottom:4px;"},"🔧 "+o.itemType));

      if(o.status!=="已完成"){card.append(e("button",{style:"width:100%;padding:14px;border:none;border-radius:10px;background:#10b981;color:#fff;font-size:26px;font-weight:900;",onclick:()=>updateDoc(doc(db,"vendor_orders",o._id),{status:"已完成"})},"✅ 已完成"));}
      else{card.append(e("div",{style:"width:100%;padding:14px;border-radius:10px;background:#f0fdf4;color:#10b981;font-size:26px;font-weight:900;text-align:center;border:2px solid #86efac;"},"✅ 已完成"));}
      body.append(card);
    });

  return root;
}
